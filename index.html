<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Мессенджер</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { height: 100vh; width: 100vw; overflow: hidden; background: linear-gradient(135deg, #0f1419 0%, #1a1f2e 100%); color: #e1e7ec; }

        /* SPLASH SCREEN */
        #splash-screen {
            position: fixed; inset: 0; background: #0f1419; z-index: 1000;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            transition: opacity 0.8s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.8s;
        }
        #splash-screen.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
        .splash-logo {
            font-size: 64px; font-weight: 900;
            background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            animation: pulseGlow 2s infinite ease-in-out; margin-bottom: 20px;
        }
        .splash-loader { width: 48px; height: 48px; border: 4px solid rgba(99, 102, 241, 0.2); border-left-color: #6366f1; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes pulseGlow { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }

        /* AUTH SCREEN */
        #auth-screen {
            position: fixed; inset: 0; background: linear-gradient(135deg, #0f1419 0%, #1a1f2e 100%);
            display: flex; justify-content: center; align-items: center; z-index: 100;
        }
        .auth-box {
            background: rgba(20, 27, 40, 0.95); padding: 40px; border-radius: 24px;
            border: 1px solid rgba(99, 102, 241, 0.25); display: flex; flex-direction: column; gap: 16px; width: 90%; max-width: 400px;
        }
        .auth-box h2 {
            background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-align: center; font-size: 32px; font-weight: 800;
        }
        input {
            background: rgba(10, 15, 23, 0.7); color: #fff; padding: 14px 16px; border: 1px solid rgba(99, 102, 241, 0.2);
            border-radius: 12px; font-size: 15px; outline: none;
        }
        input:focus { border-color: #6366f1; }
        button {
            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%); color: #fff; padding: 12px 16px;
            border: none; border-radius: 12px; font-weight: 600; font-size: 15px; cursor: pointer;
        }
        button.sec { background: rgba(30, 41, 59, 0.7); border: 1px solid rgba(99, 102, 241, 0.2); }

        /* MAIN APP */
        #app { display: flex; width: 100%; height: 100%; position: relative; }
        
        .avatar {
            width: 40px; height: 40px; border-radius: 50%;
            background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            display: flex; align-items: center; justify-content: center;
            font-weight: 700; color: #fff; flex-shrink: 0; overflow: hidden;
            border: 2px solid rgba(255, 255, 255, 0.1);
        }
        .avatar img { width: 100%; height: 100%; object-fit: cover; }
        .avatar-sm { width: 32px; height: 32px; font-size: 13px; }

        #sidebar {
            width: 340px; background: rgba(15, 20, 25, 0.95); border-right: 1px solid rgba(99, 102, 241, 0.1);
            display: flex; flex-direction: column; padding: 12px; gap: 12px; height: 100%;
        }
        #chat-area { flex-grow: 1; display: flex; flex-direction: column; background: #0f1419; height: 100%; }

        @media (max-width: 768px) {
            #sidebar { width: 100%; position: fixed; inset: 0; z-index: 10; }
            #chat-area { width: 100%; height: 100%; position: fixed; inset: 0; z-index: 20; display: none; }
            #chat-area.active { display: flex !important; }
        }

        .back-btn { display: none; background: rgba(30, 41, 59, 0.6); border: 1px solid rgba(148, 163, 184, 0.2); color: #94a3b8; padding: 6px 12px; border-radius: 8px; }
        @media (max-width: 768px) { .back-btn { display: inline-block; } }

        #chats-list, #friends-list { display: flex; flex-direction: column; gap: 6px; overflow-y: auto; flex-grow: 1; }
        .chat-item {
            padding: 10px 12px; background: rgba(20, 27, 40, 0.6); border-radius: 14px;
            cursor: pointer; display: flex; align-items: center; gap: 12px; border: 1px solid rgba(99, 102, 241, 0.1);
        }
        .chat-item.active { background: rgba(99, 102, 241, 0.2); border-color: rgba(99, 102, 241, 0.5); }

        .online-dot { width: 10px; height: 10px; border-radius: 50%; position: absolute; bottom: 0; right: 0; border: 2px solid #0f1419; }
        .online-dot.on { background: #22c55e; }
        .online-dot.off { background: #64748b; }
        .avatar-wrapper { position: relative; display: inline-block; }

        .chat-header { padding: 12px 16px; background: rgba(20, 27, 40, 0.8); border-bottom: 1px solid rgba(99, 102, 241, 0.1); display: flex; align-items: center; gap: 12px; }
        #messages { flex-grow: 1; overflow-y: auto; padding: 14px 12px; display: flex; flex-direction: column; gap: 8px; }

        .msg-wrapper { display: flex; gap: 8px; align-items: flex-end; max-width: 80%; }
        .msg-wrapper.my { align-self: flex-end; flex-direction: row-reverse; }
        .msg { padding: 10px 14px; border-radius: 18px; background: rgba(20, 27, 40, 0.9); border: 1px solid rgba(99, 102, 241, 0.1); font-size: 14px; }
        .msg-wrapper.my .msg { background: rgba(99, 102, 241, 0.9); }
        .msg b { color: #a5b4fc; font-size: 11px; display: block; margin-bottom: 2px; }

        .circle-video { width: 160px; height: 160px; border-radius: 50%; object-fit: cover; border: 3px solid rgba(99, 102, 241, 0.6); }

        .input-panel { padding: 12px; background: rgba(20, 27, 40, 0.9); border-top: 1px solid rgba(99, 102, 241, 0.1); display: flex; flex-direction: column; gap: 10px; }
        .input-row { display: flex; gap: 8px; }
        .input-panel input { flex-grow: 1; border-radius: 24px; padding: 12px 18px; }
        .buttons-row { display: flex; gap: 8px; }
        .icon-btn { background: rgba(30, 41, 59, 0.6); border: 1px solid rgba(99, 102, 241, 0.2); border-radius: 14px; width: 42px; height: 42px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .recording { background: #ef4444 !important; }

        .tabs { display: flex; gap: 6px; border-bottom: 1px solid rgba(99, 102, 241, 0.1); padding-bottom: 8px; }
        .tab { cursor: pointer; opacity: 0.5; padding: 8px 14px; font-size: 13px; font-weight: 700; }
        .tab.active { opacity: 1; color: #6366f1; }

        .user-header { display: flex; align-items: center; gap: 12px; padding: 10px; background: rgba(20, 27, 40, 0.7); border-radius: 14px; }
        .user-info { flex-grow: 1; cursor: pointer; }
        .logout-btn { background: rgba(239, 68, 68, 0.15); color: #fca5a5; padding: 6px 10px; font-size: 12px; border-radius: 8px; }
    </style>
</head>
<body>

<div id="splash-screen">
    <div class="splash-logo">Messenger</div>
    <div class="splash-loader"></div>
</div>

<div id="auth-screen">
    <div class="auth-box">
        <h2>Messenger</h2>
        <input type="text" id="username" placeholder="Логин">
        <input type="password" id="password" placeholder="Пароль" onkeydown="if(event.key==='Enter') auth('login')">
        <button onclick="auth('login')">Войти</button>
        <button class="sec" onclick="auth('register')">Зарегистрироваться</button>
    </div>
</div>

<div id="app">
    <div id="sidebar">
        <div class="user-header">
            <!-- КЛИК ДЛЯ ВЫБОРА АВАТАРКИ ИЗ ГАЛЕРЕИ -->
            <div class="avatar-wrapper" onclick="document.getElementById('avatar-file-input').click()">
                <div class="avatar" id="my-avatar">?</div>
            </div>
            <input type="file" id="avatar-file-input" style="display:none" accept="image/*" onchange="uploadAvatarFromGallery(this)">
            
            <div class="user-info" onclick="document.getElementById('avatar-file-input').click()">
                <span id="my-name">@user</span><br>
                <small style="color:#6366f1;">Загрузить фото 📁</small>
            </div>
            <button class="logout-btn" onclick="logout()">Выйти</button>
        </div>

        <div class="tabs">
            <div class="tab active" id="tab-chats" onclick="switchTab('chats')">💬 Чаты</div>
            <div class="tab" id="tab-friends" onclick="switchTab('friends')">👥 Друзья</div>
        </div>

        <div id="chats-tab-content" style="display:flex; flex-direction:column; flex-grow:1; gap: 8px;">
            <button onclick="createPrivate()">✏️ Написать</button>
            <button class="sec" onclick="createGroup()">➕ Группа</button>
            <div id="chats-list"></div>
        </div>

        <div id="friends-tab-content" style="display:none; flex-direction:column; flex-grow:1; gap: 8px;">
            <button onclick="addFriendPrompt()">➕ Добавить друга</button>
            <div id="friends-list"></div>
        </div>
    </div>
    
    <div id="chat-area">
        <div class="chat-header">
            <button class="back-btn" onclick="closeMobileChat()">←</button>
            <div id="chat-header-avatar"></div>
            <span id="chat-title" style="font-weight:700;">Выберите чат</span>
        </div>

        <div id="messages"></div>
        
        <div class="input-panel">
            <div class="input-row">
                <input type="text" id="msg-input" placeholder="Сообщение..." disabled onkeydown="if(event.key==='Enter') sendText()">
                <button onclick="sendText()">⬆️</button>
            </div>
            <div class="buttons-row">
                <div class="icon-btn" onclick="document.getElementById('file-input').click()">📸</div>
                <input type="file" id="file-input" style="display:none" onchange="sendFile(this)" accept="image/*,video/*">
                <div class="icon-btn" id="voice-btn" onclick="toggleVoice()">🎙️</div>
                <div class="icon-btn" id="circle-btn" onclick="toggleCircle()">📹</div>
            </div>
        </div>
    </div>
</div>

<script>
    let currentUser = "";
    let myAvatarUrl = "";
    let ws = null;
    let activeChatId = null;
    let pollInterval = null;

    let mediaRecorder = null;
    let audioChunks = [], videoChunks = [];
    let isRecordingVoice = false, isRecordingCircle = false;

    document.addEventListener("DOMContentLoaded", () => {
        const savedUser = localStorage.getItem('messenger_user');
        setTimeout(() => document.getElementById('splash-screen').classList.add('hidden'), 1000);

        if (savedUser) {
            currentUser = savedUser.toLowerCase();
            document.getElementById('auth-screen').style.display = 'none';
            loadUserData();
            startApp();
        }
    });

    async function loadUserData() {
        document.getElementById('my-name').innerText = `@${currentUser}`;
        try {
            const res = await fetch(`/user/${currentUser}`);
            if (res.ok) {
                const data = await res.json();
                myAvatarUrl = data.avatar_url;
                renderAvatar(document.getElementById('my-avatar'), currentUser, myAvatarUrl);
            }
        } catch(e) {}
    }

    // ЗАГРУЗКА АВАТАРКИ ИЗ ГАЛЕРЕИ В БД И НА СЕРВЕР
    async function uploadAvatarFromGallery(input) {
        if (!input.files || !input.files[0]) return;
        const file = input.files[0];
        const formData = new FormData();
        formData.append("username", currentUser);
        formData.append("file", file);

        try {
            const res = await fetch('/avatar/upload', {
                method: 'POST',
                body: formData
            });
            if (res.ok) {
                const data = await res.json();
                myAvatarUrl = data.avatar_url;
                renderAvatar(document.getElementById('my-avatar'), currentUser, myAvatarUrl);
                loadChats();
            } else {
                alert("Ошибка при загрузке фото");
            }
        } catch (e) { alert("Ошибка сервера"); }
        input.value = '';
    }

    function renderAvatar(el, username, url) {
        if (!el) return;
        if (url) {
            el.innerHTML = `<img src="${url}">`;
        } else {
            el.innerText = username ? username.charAt(0).toUpperCase() : '?';
        }
    }

    async function auth(type) {
        const u = document.getElementById('username').value.trim().toLowerCase();
        const p = document.getElementById('password').value.trim();
        if (!u || !p) return alert("Заполните все поля!");

        const res = await fetch(`/${type}`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({username: u, password: p})
        });
        const data = await res.json();
        if (res.ok) {
            currentUser = u;
            localStorage.setItem('messenger_user', u);
            document.getElementById('auth-screen').style.display = 'none';
            loadUserData();
            startApp();
        } else { alert(data.detail || "Ошибка"); }
    }

    function logout() {
        localStorage.removeItem('messenger_user');
        location.reload();
    }

    function startApp() {
        connectWS();
        loadChats();
        loadFriends();
        if (!pollInterval) {
            pollInterval = setInterval(() => {
                if (activeChatId) fetchMessages(activeChatId, true);
                loadChats();
                loadFriends();
            }, 2000);
        }
    }

    function connectWS() {
        const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
        ws = new WebSocket(`${protocol}//${location.host}/ws/${currentUser}`);
        ws.onmessage = (e) => {
            const data = JSON.parse(e.data);
            if (activeChatId && parseInt(data.chat_id) === parseInt(activeChatId)) {
                renderMessage(data);
            }
            loadChats();
        };
        ws.onclose = () => setTimeout(connectWS, 3000);
    }

    function switchTab(tab) {
        document.getElementById('tab-chats').classList.toggle('active', tab === 'chats');
        document.getElementById('tab-friends').classList.toggle('active', tab === 'friends');
        document.getElementById('chats-tab-content').style.display = tab === 'chats' ? 'flex' : 'none';
        document.getElementById('friends-tab-content').style.display = tab === 'friends' ? 'flex' : 'none';
    }

    async function loadChats() {
        const res = await fetch(`/chats/${currentUser}`);
        if (!res.ok) return;
        const chats = await res.json();
        const list = document.getElementById('chats-list');
        list.innerHTML = '';

        chats.forEach(chat => {
            const div = document.createElement('div');
            div.className = `chat-item ${chat.id === activeChatId ? 'active' : ''}`;
            
            const avatarDiv = document.createElement('div');
            avatarDiv.className = 'avatar-wrapper';
            const avatarEl = document.createElement('div');
            avatarEl.className = 'avatar avatar-sm';
            renderAvatar(avatarEl, chat.name.replace('@',''), chat.avatar_url);
            avatarDiv.appendChild(avatarEl);

            if (chat.type === 'private') {
                avatarDiv.innerHTML += `<span class="online-dot ${chat.online ? 'on' : 'off'}"></span>`;
            }

            div.appendChild(avatarDiv);
            div.innerHTML += `<span style="font-weight:600; flex-grow:1;">${chat.name}</span>`;
            
            const delBtn = document.createElement('button');
            delBtn.style.cssText = "background:none; border:none; color:#ef4444; cursor:pointer;";
            delBtn.innerText = '✕';
            delBtn.onclick = (e) => deleteChat(e, chat.id);
            div.appendChild(delBtn);

            div.onclick = (e) => { if (e.target.tagName !== 'BUTTON') openChat(chat.id, chat.name, chat.avatar_url); };
            list.appendChild(div);
        });
    }

    async function deleteChat(e, chatId) {
        e.stopPropagation();
        if(!confirm("Удалить чат?")) return;
        await fetch(`/chats/${chatId}`, { method: 'DELETE' });
        if(activeChatId === chatId) closeMobileChat();
        loadChats();
    }

    async function loadFriends() {
        const res = await fetch(`/friends/${currentUser}`);
        if (!res.ok) return;
        const friends = await res.json();
        const list = document.getElementById('friends-list');
        list.innerHTML = '';

        friends.forEach(friend => {
            const div = document.createElement('div');
            div.className = 'chat-item';
            
            const avatarDiv = document.createElement('div');
            avatarDiv.className = 'avatar-wrapper';
            const avatarEl = document.createElement('div');
            avatarEl.className = 'avatar avatar-sm';
            renderAvatar(avatarEl, friend.username, friend.avatar_url);
            avatarDiv.appendChild(avatarEl);
            avatarDiv.innerHTML += `<span class="online-dot ${friend.online ? 'on' : 'off'}"></span>`;

            div.appendChild(avatarDiv);
            div.innerHTML += `<span style="font-weight:600;">@${friend.username}</span>`;
            div.onclick = () => startPrivateWith(friend.username);
            list.appendChild(div);
        });
    }

    async function addFriendPrompt() {
        const target = prompt("@username:");
        if (!target) return;
        const res = await fetch('/friends/add', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({username: currentUser, friend_username: target.toLowerCase()})
        });
        if(res.ok) loadFriends(); else alert("Ошибка добавления");
    }

    async function startPrivateWith(targetUsername) {
        const res = await fetch('/chats/private', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({sender_username: currentUser, target_username: targetUsername})
        });
        const data = await res.json();
        switchTab('chats');
        openChat(data.chat_id, `@${targetUsername}`);
    }

    async function openChat(chatId, title = "Чат", avatarUrl = "") {
        activeChatId = chatId;
        document.getElementById('msg-input').disabled = false;
        document.getElementById('chat-title').innerText = title;
        
        const headerAvatar = document.getElementById('chat-header-avatar');
        headerAvatar.innerHTML = '';
        const av = document.createElement('div');
        av.className = 'avatar avatar-sm';
        renderAvatar(av, title.replace('@','').replace('👥 ',''), avatarUrl);
        headerAvatar.appendChild(av);

        document.getElementById('chat-area').classList.add('active');
        await fetchMessages(chatId);
    }

    function closeMobileChat() {
        activeChatId = null;
        document.getElementById('chat-area').classList.remove('active');
        document.getElementById('msg-input').disabled = true;
        document.getElementById('messages').innerHTML = '';
        document.getElementById('chat-title').innerText = 'Выберите чат';
        document.getElementById('chat-header-avatar').innerHTML = '';
    }

    let lastHash = "";
    async function fetchMessages(chatId, isBackground = false) {
        const res = await fetch(`/messages/${chatId}/${currentUser}`);
        if (!res.ok) return;
        const messages = await res.json();
        
        const hash = JSON.stringify(messages);
        if (isBackground && hash === lastHash) return;
        lastHash = hash;

        const box = document.getElementById('messages');
        box.innerHTML = '';
        messages.forEach(renderMessage);
    }

    function renderMessage(data) {
        const box = document.getElementById('messages');
        const isMy = data.sender === currentUser;
        
        const wrapper = document.createElement('div');
        wrapper.className = `msg-wrapper ${isMy ? 'my' : ''}`;
        
        const avatar = document.createElement('div');
        avatar.className = 'avatar avatar-sm';
        renderAvatar(avatar, data.sender, data.avatar_url);

        const div = document.createElement('div');
        div.className = 'msg';
        
        let html = `<b>@${data.sender}</b>`;
        if (data.type === 'text') html += data.content;
        else if (data.type === 'image') html += `<img src="${data.content}" style="max-width:100%; border-radius:12px;" onclick="window.open(this.src)">`;
        else if (data.type === 'voice') html += `<audio controls src="${data.content}"></audio>`;
        else if (data.type === 'circle') html += `<video class="circle-video" src="${data.content}" autoplay loop playsinline controls></video>`;
        
        div.innerHTML = html;
        wrapper.appendChild(avatar);
        wrapper.appendChild(div);
        box.appendChild(wrapper);
        box.scrollTop = box.scrollHeight;
    }

    function sendText() {
        const input = document.getElementById('msg-input');
        if (!input.value.trim() || !activeChatId) return;
        if (ws && ws.readyState === WebSocket.OPEN) {
            ws.send(JSON.stringify({ chat_id: activeChatId, type: 'text', content: input.value.trim() }));
            input.value = '';
        }
    }

    function sendFile(input) {
        if (!input.files || !input.files[0] || !activeChatId) return;
        const reader = new FileReader();
        reader.onload = (e) => {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ chat_id: activeChatId, type: 'image', content: e.target.result }));
            }
        };
        reader.readAsDataURL(input.files[0]);
        input.value = '';
    }

    async function toggleVoice() {
        if (!activeChatId) return;
        const btn = document.getElementById('voice-btn');
        if (!isRecordingVoice) {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            mediaRecorder = new MediaRecorder(stream);
            audioChunks = [];
            mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
            mediaRecorder.onstop = () => {
                const blob = new Blob(audioChunks, { type: 'audio/webm' });
                const reader = new FileReader();
                reader.onloadend = () => {
                    if (ws) ws.send(JSON.stringify({ chat_id: activeChatId, type: 'voice', content: reader.result }));
                };
                reader.readAsDataURL(blob);
                stream.getTracks().forEach(t => t.stop());
            };
            mediaRecorder.start();
            isRecordingVoice = true;
            btn.classList.add('recording');
        } else {
            mediaRecorder.stop();
            isRecordingVoice = false;
            btn.classList.remove('recording');
        }
    }

    async function toggleCircle() {
        if (!activeChatId) return;
        const btn = document.getElementById('circle-btn');
        if (!isRecordingCircle) {
            const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 300, height: 300 }, audio: true });
            mediaRecorder = new MediaRecorder(stream);
            videoChunks = [];
            mediaRecorder.ondataavailable = e => videoChunks.push(e.data);
            mediaRecorder.onstop = () => {
                const blob = new Blob(videoChunks, { type: 'video/webm' });
                const reader = new FileReader();
                reader.onloadend = () => {
                    if (ws) ws.send(JSON.stringify({ chat_id: activeChatId, type: 'circle', content: reader.result }));
                };
                reader.readAsDataURL(blob);
                stream.getTracks().forEach(t => t.stop());
            };
            mediaRecorder.start();
            isRecordingCircle = true;
            btn.classList.add('recording');
        } else {
            mediaRecorder.stop();
            isRecordingCircle = false;
            btn.classList.remove('recording');
        }
    }

    function createPrivate() {
        const target = prompt("@username:");
        if (target) startPrivateWith(target.toLowerCase());
    }

    async function createGroup() {
        const name = prompt("Название группы:");
        if (!name) return;
        const membersStr = prompt("Логины через запятую:");
        if (!membersStr) return;
        const members = membersStr.split(',').map(m => m.trim().toLowerCase());
        members.push(currentUser);
        
        const res = await fetch('/chats/group', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({name: name, members: members})
        });
        const data = await res.json();
        openChat(data.chat_id, `👥 ${name}`);
    }
</script>
</body>
</html>
