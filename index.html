<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messenger</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f3f5;
            color: #222;
        }

        .app {
            width: min(900px, 100%);
            height: 100vh;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            background: white;
        }

        header {
            padding: 16px 20px;
            color: white;
            background: #2563eb;
        }

        header h1 {
            margin: 0 0 6px;
            font-size: 22px;
        }

        #current-user {
            font-size: 14px;
            opacity: 0.9;
        }

        .login {
            display: flex;
            gap: 8px;
            padding: 14px;
            border-bottom: 1px solid #ddd;
        }

        input {
            min-width: 0;
            flex: 1;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            padding: 12px 18px;
            border: 0;
            border-radius: 8px;
            color: white;
            background: #2563eb;
            font-size: 15px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        button:disabled {
            cursor: not-allowed;
            opacity: 0.5;
        }

        #messages {
            flex: 1;
            overflow-y: auto;
            padding: 18px;
        }

        .message {
            width: fit-content;
            max-width: 85%;
            margin-bottom: 12px;
            padding: 10px 13px;
            border-radius: 12px;
            background: #e5e7eb;
            overflow-wrap: anywhere;
        }

        .message.mine {
            margin-left: auto;
            color: white;
            background: #2563eb;
        }

        .message-author {
            margin-bottom: 4px;
            font-size: 12px;
            font-weight: bold;
            opacity: 0.75;
        }

        .message-text {
            white-space: pre-wrap;
        }

        .system {
            margin: 10px 0;
            color: #64748b;
            text-align: center;
            font-size: 13px;
        }

        .status {
            padding: 10px 16px;
            border-top: 1px solid #ddd;
            color: #b91c1c;
            font-size: 14px;
        }

        .status.connected {
            color: #15803d;
        }

        .composer {
            display: flex;
            gap: 8px;
            padding: 14px;
            border-top: 1px solid #ddd;
        }

        @media (max-width: 600px) {
            .login,
            .composer {
                padding: 10px;
            }

            #messages {
                padding: 12px;
            }
        }
    </style>
</head>

<body>
<div class="app">
    <header>
        <h1>Messenger</h1>
        <div id="current-user">Пользователь не выбран</div>
    </header>

    <form class="login" id="login-form">
        <input
            id="username"
            type="text"
            maxlength="30"
            placeholder="Введите имя"
            autocomplete="nickname"
            required
        >
        <button type="submit">Войти</button>
    </form>

    <main id="messages"></main>

    <div class="status" id="status">
        Нет соединения
    </div>

    <form class="composer" id="message-form">
        <input
            id="message-input"
            type="text"
            maxlength="2000"
            placeholder="Введите сообщение..."
            autocomplete="off"
            disabled
        >
        <button id="send-button" type="submit" disabled>
            Отправить
        </button>
    </form>
</div>

<script>
    let socket = null;
    let username = "";
    let reconnectTimer = null;
    let manuallyClosed = false;

    const loginForm = document.getElementById("login-form");
    const usernameInput = document.getElementById("username");
    const messageForm = document.getElementById("message-form");
    const messageInput = document.getElementById("message-input");
    const sendButton = document.getElementById("send-button");
    const messagesElement = document.getElementById("messages");
    const statusElement = document.getElementById("status");
    const currentUserElement = document.getElementById("current-user");

    function setStatus(text, connected = false) {
        statusElement.textContent = text;
        statusElement.classList.toggle("connected", connected);
    }

    function addSystemMessage(text) {
        const element = document.createElement("div");
        element.className = "system";
        element.textContent = text;
        messagesElement.appendChild(element);
        scrollToBottom();
    }

    function addMessage(message) {
        const element = document.createElement("div");
        element.className = "message";

        if (message.username === username) {
            element.classList.add("mine");
        }

        const author = document.createElement("div");
        author.className = "message-author";
        author.textContent = message.username;

        const text = document.createElement("div");
        text.className = "message-text";
        text.textContent = message.text;

        element.appendChild(author);
        element.appendChild(text);
        messagesElement.appendChild(element);

        scrollToBottom();
    }

    function scrollToBottom() {
        messagesElement.scrollTop = messagesElement.scrollHeight;
    }

    async function loadMessages() {
        try {
            const response = await fetch("/messages");

            if (!response.ok) {
                throw new Error("Не удалось загрузить сообщения");
            }

            const messages = await response.json();

            messagesElement.innerHTML = "";

            for (const message of messages) {
                addMessage(message);
            }
        } catch (error) {
            console.error(error);
        }
    }

    function connectWebSocket() {
        if (!username) {
            return;
        }

        if (socket && (
            socket.readyState === WebSocket.OPEN ||
            socket.readyState === WebSocket.CONNECTING
        )) {
            return;
        }

        const protocol = window.location.protocol === "https:" ? "wss:" : "ws:";
        const websocketUrl =
            `${protocol}//${window.location.host}/ws?username=${encodeURIComponent(username)}`;

        console.log("Подключение к WebSocket:", websocketUrl);
        setStatus("Подключение...");

        socket = new WebSocket(websocketUrl);

        socket.onopen = () => {
            console.log("WebSocket подключен");
            setStatus("Соединение установлено", true);

            messageInput.disabled = false;
            sendButton.disabled = false;
            messageInput.focus();
        };

        socket.onmessage = (event) => {
            try {
                const data = JSON.parse(event.data);

                if (data.type === "message") {
                    addMessage(data);
                } else if (data.type === "system") {
                    addSystemMessage(data.text);
                } else if (data.type === "pong") {
                    console.log("Pong получен");
                }
            } catch (error) {
                console.error("Ошибка обработки сообщения:", error);
            }
        };

        socket.onerror = (error) => {
            console.error("Ошибка WebSocket:", error);
            setStatus("Ошибка соединения");
        };

        socket.onclose = (event) => {
            console.log("WebSocket закрыт:", event.code, event.reason);

            messageInput.disabled = true;
            sendButton.disabled = true;

            if (!manuallyClosed) {
                setStatus("Нет соединения, переподключение...");

                clearTimeout(reconnectTimer);
                reconnectTimer = setTimeout(connectWebSocket, 3000);
            }
        };
    }

    loginForm.addEventListener("submit", async (event) => {
        event.preventDefault();

        const enteredUsername = usernameInput.value.trim();

        if (!enteredUsername) {
            return;
        }

        username = enteredUsername;
        currentUserElement.textContent = `Вы вошли как: ${username}`;

        await loadMessages();
        connectWebSocket();
    });

    messageForm.addEventListener("submit", (event) => {
        event.preventDefault();

        const text = messageInput.value.trim();

        if (!text) {
            return;
        }

        if (!socket || socket.readyState !== WebSocket.OPEN) {
            setStatus("Соединение ещё не установлено");
            return;
        }

        socket.send(JSON.stringify({
            type: "message",
            text: text
        }));

        messageInput.value = "";
        messageInput.focus();
    });

    // Прикладной heartbeat. Настоящий WebSocket ping выполняет Uvicorn.
    setInterval(() => {
        if (socket && socket.readyState === WebSocket.OPEN) {
            socket.send(JSON.stringify({
                type: "ping"
            }));
        }
    }, 25000);

    window.addEventListener("beforeunload", () => {
        manuallyClosed = true;

        if (socket) {
            socket.close();
        }
    });
</script>
</body>
</html>
