<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Мессенджер</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        
        body { height: 100vh; width: 100vw; overflow: hidden; background: #0b0e14; color: #e1e7ec; }

        /* Экран авторизации */
        #auth-screen { 
            position: fixed; inset: 0; 
            background: radial-gradient(circle at center, #1a2332 0%, #0b0e14 100%); 
            display: flex; justify-content: center; align-items: center; z-index: 100; 
        }
        .auth-box { 
            background: rgba(22, 30, 44, 0.85); 
            backdrop-filter: blur(12px);
            padding: 32px; 
            border-radius: 16px; 
            border: 1px solid rgba(255, 255, 255, 0.08); 
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4); 
            display: flex; flex-direction: column; gap: 16px; 
            width: 90%; max-width: 360px; 
        }
        .auth-box h2 { color: #6366f1; text-align: center; font-size: 24px; font-weight: 700; margin-bottom: 8px; }
        
        input { 
            background: #111722; color: #fff; padding: 14px; 
            border: 1px solid #232d3f; border-radius: 10px; 
            font-size: 15px; outline: none; transition: 0.2s; 
        }
        input:focus { border-color: #6366f1; box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2); }
        
        button { 
            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%); 
            color: #fff; padding: 14px; border: none; border-radius: 10px; 
            font-weight: 600; font-size: 15px; cursor: pointer; transition: 0.2s; 
        }
        button:hover { opacity: 0.9; transform: translateY(-1px); }
        button.sec { background: #1a2332; border: 1px solid #2d3a4e; color: #94a3b8; }

        #app { display: flex; width: 100%; height: 100%; position: relative; }
        
        /* Боковое меню */
        #sidebar { 
            width: 340px; background: #111722; 
            border-right: 1px solid #1e293b; 
            display: flex; flex-direction: column; padding: 16px; gap: 12px; height: 100%; 
        }
        #chat-area { flex-grow: 1; display: flex; flex-direction: column; background: #0b0e14; height: 100%; position: relative; }
        
        @media (max-width: 768px) {
            #sidebar { width: 100%; position: absolute; inset: 0; z-index: 10; }
            #chat-area { width: 100%; position: absolute; inset: 0; z-index: 20; display: none; }
            #chat-area.active { display: flex; }
        }

        .back-btn { 
            display: none; background: #1e293b; border: none; color: #94a3b8; 
            padding: 6px 12px; font-size: 13px; border-radius: 6px; cursor: pointer; margin-right: 10px; 
        }
        @media (max-width: 768px) { .back-btn { display: inline-block; } }

        #chats-list, #friends-list { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; overflow-y: auto; flex-grow: 1; }
        .chat-item { 
            padding: 14px; background: #161e2c; border-radius: 10px; 
            cursor: pointer; display: flex; justify-content: space-between; align-items: center; 
            font-weight: 500; color: #cbd5e1; transition: 0.2s; border: 1px solid transparent; 
        }
        .chat-item:hover, .chat-item.active { background: #1e293b; border-color: rgba(99, 102, 241, 0.4); color: #fff; }
        .del-btn { background: transparent; border: none; color: #ef4444; font-size: 16px; padding: 2px 6px; opacity: 0.6; }
        .del-btn:hover { opacity: 1; }

        .online-dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; margin-right: 8px; }
        .online-dot.on { background: #22c55e; box-shadow: 0 0 8px #22c55e; }
        .online-dot.off { background: #64748b; }

        .chat-header { 
            padding: 16px; background: #111722; 
            border-bottom: 1px solid #1e293b; 
            display: flex; align-items: center; flex-shrink: 0; font-size: 16px; font-weight: 600; 
        }
        
        #messages { 
            flex-grow: 1; overflow-y: auto; padding: 20px; 
            display: flex; flex-direction: column; gap: 10px; 
        }
        
        .msg { 
            max-width: 75%; padding: 12px 16px; border-radius: 14px; 
            background: #161e2c; border: 1px solid #1e293b; 
            align-self: flex-start; word-wrap: break-word; color: #e2e8f0; font-size: 14px; 
        }
        .msg.my { 
            background: linear-gradient(135deg, #4f46e5 0%, #4338ca 100%); 
            border: none; align-self: flex-end; color: #fff; 
        }
        .msg b { color: #818cf8; font-size: 12px; display: block; margin-bottom: 2px; }
        .msg.my b { color: #c7d2fe; }
        .msg-meta { display: flex; justify-content: flex-end; align-items: center; gap: 4px; font-size: 10px; opacity: 0.7; margin-top: 4px; }

        .chat-img { max-width: 100%; border-radius: 8px; margin-top: 6px; cursor: pointer; }
        .circle-video { width: 160px; height: 160px; border-radius: 50%; object-fit: cover; border: 2px solid #6366f1; margin-top: 6px; }
        audio { margin-top: 6px; max-width: 220px; filter: invert(0.9) hue-rotate(170deg); }

        .input-panel { 
            padding: 12px 16px; background: #111722; 
            border-top: 1px solid #1e293b; display: flex; gap: 8px; align-items: center; flex-shrink: 0; 
        }
        .input-panel input { flex-grow: 1; border-radius: 20px; padding: 10px 16px; background: #0b0e14; }
        
        .icon-btn { 
            background: #161e2c; border: 1px solid #1e293b; border-radius: 50%; 
            width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; 
            cursor: pointer; font-size: 16px; flex-shrink: 0; transition: 0.2s; 
        }
        .icon-btn:hover { background: #1e293b; color: #6366f1; }
        .recording { background: #ef4444 !important; border-color: #f87171 !important; color: white !important; animation: pulse 1s infinite; }

        .tabs { display: flex; gap: 6px; border-bottom: 1px solid #1e293b; padding-bottom: 10px; }
        .tab { cursor: pointer; opacity: 0.5; padding: 8px 16px; font-size: 13px; font-weight: 600; border-radius: 8px; background: #161e2c; }
        .tab.active { opacity: 1; color: #6366f1; background: #1e293b; }

        .user-header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 12px; border-bottom: 1px solid #1e293b; }
        .logout-btn { background: #271515; border: 1px solid #451a1a; color: #f87171; padding: 6px 12px; font-size: 12px; border-radius: 8px; }

        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
    </style>
</head>
<body>

<div id="auth-screen">
    <div class="auth-box">
        <h2>Мессенджер</h2>
        <input type="text" id="username" placeholder="Логин (@username)">
        <input type="password" id="password" placeholder="Пароль">
        <button onclick="auth('login')">Войти</button>
        <button class="sec" onclick="auth('register')">Зарегистрироваться</button>
    </div>
</div>

<div id="app">
    <div id="sidebar">
        <div class="user-header">
            <span id="my-name" style="font-weight:bold; color:#fff;"></span>
            <button class="logout-btn" onclick="logout()">Выйти</button>
        </div>

        <div class="tabs" style="margin-top:5px">
            <div class="tab active" id="tab-chats" onclick="switchTab('chats')">Чаты</div>
            <div class="tab" id="tab-friends" onclick="switchTab('friends')">Друзья</div>
        </div>

        <div id="chats-tab-content" style="display:flex; flex-direction:column; flex-grow:1; overflow:hidden;">
            <button onclick="createPrivate()" style="width:100%; margin-top:10px">+ Написать в ЛС</button>
            <button class="sec" onclick="createGroup()" style="width:100%; margin-top:5px">+ Создать группу</button>
            <div id="chats-list"></div>
        </div>

        <div id="friends-tab-content" style="display:none; flex-direction:column; flex-grow:1; overflow:hidden;">
            <button onclick="addFriendPrompt()" style="width:100%; margin-top:10px">+ Добавить друга</button>
            <div id="friends-list"></div>
        </div>
    </div>
    
    <div id="chat-area">
        <div class="chat-header">
            <button class="back-btn" onclick="closeMobileChat()">⬅ Назад</button>
            <span id="chat-title">Выберите чат</span>
        </div>

        <div id="messages"></div>
        
        <div class="input-panel">
            <input type="text" id="msg-input" placeholder="Напишите сообщение..." disabled onkeydown="if(event.key==='Enter') sendText()">
            <div class="icon-btn" onclick="document.getElementById('file-input').click()" title="Фото/Файл">📁</div>
            <input type="file" id="file-input" style="display:none" onchange="sendFile(this)" accept="image/*">
            <div class="icon-btn" id="voice-btn" title="Голосовое" onclick="toggleVoice()">🎙️</div>
            <div class="icon-btn" id="circle-btn" title="Кружочек" onclick="toggleCircle()">🎯</div>
            <button onclick="sendText()" style="padding:10px 18px; border-radius:20px;">Отправить</button>
        </div>
    </div>
</div>

<script>
    let currentUser = "";
    let ws = null;
    let activeChatId = null;
    let pollInterval = null;
    
    let mediaRecorder = null;
    let audioChunks = [];
    let videoChunks = [];
    let isRecordingVoice = false;
    let isRecordingCircle = false;

    document.addEventListener("DOMContentLoaded", () => {
        const savedUser = localStorage.getItem('messenger_user');
        if (savedUser) {
            currentUser = savedUser.toLowerCase();
            document.getElementById('auth-screen').style.display = 'none';
            document.getElementById('my-name').innerText = `@${currentUser}`;
            startApp();
        } else {
            document.getElementById('auth-screen').style.display = 'flex';
        }
    });

    function startApp() {
        connectWS();
        loadChats();
        loadFriends();
        if (!pollInterval) {
            pollInterval = setInterval(() => {
                if (activeChatId) fetchMessages(activeChatId, true);
                loadChats();
                loadFriends();
            }, 2000);
        }
    }

    async function auth(type) {
        const u = document.getElementById('username').value.trim().toLowerCase();
        const p = document.getElementById('password').value.trim();
        if(!u || !p) return alert("Заполните все поля!");

        try {
            const res = await fetch(`/${type}`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({username: u, password: p})
            });
            const data = await res.json();
            
            if (res.ok) {
                currentUser = u;
                localStorage.setItem('messenger_user', u);
                document.getElementById('auth-screen').style.display = 'none';
                document.getElementById('my-name').innerText = `@${currentUser}`;
                startApp();
            } else {
                alert(data.detail || "Ошибка входа");
            }
        } catch (e) { alert("Ошибка подключения к серверу"); }
    }

    function logout() {
        localStorage.removeItem('messenger_user');
        location.reload();
    }

    function connectWS() {
        if (!currentUser) return;
        const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
        ws = new WebSocket(`${protocol}//${location.host}/ws/${currentUser}`);
        
        ws.onmessage = (e) => {
            const data = JSON.parse(e.data);
            if (activeChatId && parseInt(data.chat_id) === parseInt(activeChatId)) {
                renderMessage(data);
            }
            loadChats();
        };

        ws.onclose = () => setTimeout(connectWS, 3000);
    }

    function switchTab(tab) {
        document.getElementById('tab-chats').classList.toggle('active', tab === 'chats');
        document.getElementById('tab-friends').classList.toggle('active', tab === 'friends');
        document.getElementById('chats-tab-content').style.display = tab === 'chats' ? 'flex' : 'none';
        document.getElementById('friends-tab-content').style.display = tab === 'friends' ? 'flex' : 'none';
    }

    async function loadChats() {
        if (!currentUser) return;
        try {
            const res = await fetch(`/chats/${currentUser}`);
            if (!res.ok) return;
            const chats = await res.json();
            const list = document.getElementById('chats-list');
            list.innerHTML = '';

            chats.forEach(chat => {
                const div = document.createElement('div');
                div.className = `chat-item ${chat.id === activeChatId ? 'active' : ''}`;
                
                const dotClass = chat.online ? 'on' : 'off';
                const dotHtml = chat.type === 'private' ? `<span class="online-dot ${dotClass}"></span>` : '';
                
                div.innerHTML = `
                    <span>${dotHtml}${chat.name}</span>
                    <button class="del-btn" onclick="deleteChat(event, ${chat.id})">✖</button>
                `;
                div.onclick = (e) => {
                    if(e.target.tagName !== 'BUTTON') openChat(chat.id, chat.name);
                };
                list.appendChild(div);
            });
        } catch (e) {}
    }

    async function deleteChat(event, chatId) {
        event.stopPropagation();
        if(!confirm("Удалить этот чат?")) return;
        await fetch(`/chats/${chatId}`, { method: 'DELETE' });
        if(activeChatId === chatId) {
            activeChatId = null;
            closeMobileChat();
        }
        loadChats();
    }

    async function loadFriends() {
        if (!currentUser) return;
        try {
            const res = await fetch(`/friends/${currentUser}`);
            if (!res.ok) return;
            const friends = await res.json();
            const list = document.getElementById('friends-list');
            list.innerHTML = '';

            friends.forEach(friend => {
                const div = document.createElement('div');
                div.className = 'chat-item';
                const dotClass = friend.online ? 'on' : 'off';
                div.innerHTML = `
                    <div>
                        <span class="online-dot ${dotClass}"></span>
                        <span>@${friend.username}</span>
                    </div>
                `;
                div.onclick = () => startPrivateWith(friend.username);
                list.appendChild(div);
            });
        } catch (e) {}
    }

    async function addFriendPrompt() {
        const target = prompt("Введите @username друга:");
        if (!target) return;
        const res = await fetch('/friends/add', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({username: currentUser, friend_username: target})
        });
        const data = await res.json();
        if(res.ok) {
            alert("Друг добавлен!");
            loadFriends();
        } else { alert(data.detail); }
    }

    async function startPrivateWith(targetUsername) {
        const res = await fetch('/chats/private', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({sender_username: currentUser, target_username: targetUsername})
        });
        const data = await res.json();
        switchTab('chats');
        openChat(data.chat_id, `@${targetUsername}`);
    }

    async function openChat(chatId, title = "Чат") {
        activeChatId = chatId;
        document.getElementById('msg-input').disabled = false;
        document.getElementById('chat-title').innerText = title;
        document.getElementById('chat-area').classList.add('active');
        
        loadChats();
        fetchMessages(chatId, false);
    }

    function closeMobileChat() {
        activeChatId = null;
        document.getElementById('chat-area').classList.remove('active');
        document.getElementById('messages').innerHTML = '';
        document.getElementById('msg-input').disabled = true;
    }

    let lastMessagesHash = "";
    async function fetchMessages(chatId, isBackground = false) {
        try {
            const res = await fetch(`/messages/${chatId}/${currentUser}`);
            const messages = await res.json();
            
            const currentHash = JSON.stringify(messages);
            if (isBackground && currentHash === lastMessagesHash) return;
            lastMessagesHash = currentHash;

            const box = document.getElementById('messages');
            box.innerHTML = '';
            messages.forEach(msg => renderMessage(msg));
        } catch(e) {}
    }

    function renderMessage(data) {
        const box = document.getElementById('messages');
        const div = document.createElement('div');
        div.className = `msg ${data.sender === currentUser ? 'my' : ''}`;
        
        let contentHTML = `<b>${data.sender}</b>`;
        if (data.type === 'text') {
            contentHTML += data.content;
        } else if (data.type === 'image') {
            contentHTML += `<img src="${data.content}" class="chat-img" onclick="window.open(this.src)">`;
        } else if (data.type === 'voice') {
            contentHTML += `<audio controls src="${data.content}"></audio>`;
        } else if (data.type === 'circle') {
            contentHTML += `<video class="circle-video" src="${data.content}" autoplay loop muted playsinline></video>`;
        }
        
        let statusTag = '';
        if (data.sender === currentUser) {
            statusTag = data.is_read ? '✓✓ Прочитано' : '✓ Отправлено';
        }
        
        contentHTML += `<div class="msg-meta">${statusTag}</div>`;
        
        div.innerHTML = contentHTML;
        box.appendChild(div);
        box.scrollTop = box.scrollHeight;
    }

    function sendText() {
        const input = document.getElementById('msg-input');
        if (!input.value.trim() || !activeChatId) return;
        
        const text = input.value.trim();
        input.value = '';

        if (ws && ws.readyState === WebSocket.OPEN) {
            ws.send(JSON.stringify({ chat_id: activeChatId, type: 'text', content: text }));
        }
    }

    function sendFile(input) {
        if (!input.files || !input.files[0] || !activeChatId) return;
        const file = input.files[0];
        const reader = new FileReader();
        reader.onload = function(e) {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ chat_id: activeChatId, type: 'image', content: e.target.result }));
            }
        };
        reader.readAsDataURL(file);
        input.value = '';
    }

    async function toggleVoice() {
        if (!activeChatId) return alert("Сначала выберите чат!");
        const btn = document.getElementById('voice-btn');
        
        if (!isRecordingVoice) {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];
                
                mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                mediaRecorder.onstop = async () => {
                    const blob = new Blob(audioChunks, { type: 'audio/webm' });
                    const reader = new FileReader();
                    reader.readAsDataURL(blob);
                    reader.onloadend = () => {
                        ws.send(JSON.stringify({ chat_id: activeChatId, type: 'voice', content: reader.result }));
                    };
                };
                
                mediaRecorder.start();
                isRecordingVoice = true;
                btn.classList.add('recording');
            } catch(e) { alert("Ошибка микрофона"); }
        } else {
            mediaRecorder.stop();
            isRecordingVoice = false;
            btn.classList.remove('recording');
        }
    }

    async function toggleCircle() {
        if (!activeChatId) return alert("Сначала выберите чат!");
        const btn = document.getElementById('circle-btn');
        
        if (!isRecordingCircle) {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 200, height: 200 }, audio: true });
                mediaRecorder = new MediaRecorder(stream);
                videoChunks = [];
                
                mediaRecorder.ondataavailable = e => videoChunks.push(e.data);
                mediaRecorder.onstop = async () => {
                    const blob = new Blob(videoChunks, { type: 'video/webm' });
                    const reader = new FileReader();
                    reader.readAsDataURL(blob);
                    reader.onloadend = () => {
                        ws.send(JSON.stringify({ chat_id: activeChatId, type: 'circle', content: reader.result }));
                    };
                    stream.getTracks().forEach(track => track.stop());
                };
                
                mediaRecorder.start();
                isRecordingCircle = true;
                btn.classList.add('recording');
            } catch(e) { alert("Ошибка камеры"); }
        } else {
            mediaRecorder.stop();
            isRecordingCircle = false;
            btn.classList.remove('recording');
        }
    }

    async function createPrivate() {
        const target = prompt("Логин собеседника:");
        if (!target) return;
        startPrivateWith(target.toLowerCase());
    }

    async function createGroup() {
        const name = prompt("Название группы:");
        const membersStr = prompt("Логины участников через запятую:");
        if (!name || !membersStr) return;
        const members = membersStr.split(',').map(m => m.trim().toLowerCase());
        members.push(currentUser);
        
        const res = await fetch('/chats/group', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({name: name, members: members})
        });
        const data = await res.json();
        openChat(data.chat_id, `👥 ${name}`);
    }
</script>
</body>
</html>
