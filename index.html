<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Clone</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { display: flex; height: 100vh; background: #0e1621; color: #fff; }

        /* Экран входа */
        #auth-screen { position: fixed; inset: 0; background: #0e1621; display: flex; justify-content: center; align-items: center; z-index: 100; }
        .auth-box { background: #17212b; padding: 25px; border-radius: 12px; display: flex; flex-direction: column; gap: 12px; width: 320px; }
        input, button { padding: 12px; border-radius: 8px; border: none; font-size: 14px; outline: none; }
        input { background: #242f3d; color: #fff; }
        button { background: #5288c1; color: #fff; font-weight: bold; cursor: pointer; }
        button.sec { background: #242f3d; }

        /* Главный интерфейс */
        #app { display: flex; width: 100%; height: 100%; }
        #sidebar { width: 320px; border-right: 1px solid #242f3d; display: flex; flex-direction: column; padding: 15px; gap: 10px; background: #17212b; }
        #chat-area { flex-grow: 1; display: flex; flex-direction: column; background: #0e1621; }
        
        #messages { flex-grow: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
        .msg { max-width: 65%; padding: 10px 14px; border-radius: 12px; background: #182533; align-self: flex-start; word-wrap: break-word; }
        .msg.my { background: #2b5278; align-self: flex-end; }
        
        /* Кружочки и медиа */
        .circle-video { width: 200px; height: 200px; border-radius: 50%; object-fit: cover; border: 3px solid #5288c1; display: block; margin-top: 5px; }
        audio { margin-top: 5px; max-width: 250px; }

        /* Панель ввода */
        .input-panel { padding: 15px; background: #17212b; display: flex; gap: 10px; align-items: center; }
        .input-panel input { flex-grow: 1; }
        .icon-btn { background: #242f3d; border-radius: 50%; width: 42px; height: 42px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 18px; }
        .recording { background: #e53935 !important; animation: pulse 1s infinite; }

        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
    </style>
</head>
<body>

<!-- Экран Авторизации -->
<div id="auth-screen">
    <div class="auth-box">
        <h3 style="text-align:center">Мессенджер</h3>
        <input type="text" id="username" placeholder="Имя пользователя (@username)">
        <input type="password" id="password" placeholder="Пароль">
        <button onclick="auth('login')">Войти</button>
        <button class="sec" onclick="auth('register')">Зарегистрироваться</button>
    </div>
</div>

<!-- Основной Мессенджер -->
<div id="app">
    <div id="sidebar">
        <h3>Чаты</h3>
        <button onclick="createPrivate()">+ Написать в ЛС</button>
        <button class="sec" onclick="createGroup()">+ Создать группу</button>
        <div id="chats-list" style="margin-top:10px"></div>
    </div>
    
    <div id="chat-area">
        <div id="messages"></div>
        
        <div class="input-panel">
            <input type="text" id="msg-input" placeholder="Напишите сообщение...">
            <button onclick="sendText()">Отправить</button>
            
            <!-- Кнопка ГС -->
            <div class="icon-btn" id="voice-btn" title="Удерживай или нажми для ГС" onclick="toggleVoice()">🎤</div>
            <!-- Кнопка Кружочка -->
            <div class="icon-btn" id="circle-btn" title="Записать кружочек" onclick="toggleCircle()">📷</div>
        </div>
    </div>
</div>

<script>
    let currentUser = "";
    let ws = null;
    let activeChatId = null;
    
    let mediaRecorder = null;
    let audioChunks = [];
    let videoChunks = [];
    let isRecordingVoice = false;
    let isRecordingCircle = false;

    // Вход / Регистрация
    async function auth(type) {
        const u = document.getElementById('username').value.trim();
        const p = document.getElementById('password').value.trim();
        if(!u || !p) return alert("Заполните все поля");

        const res = await fetch(`/${type}`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({username: u, password: p})
        });
        const data = await res.json();
        
        if (res.ok) {
            currentUser = u;
            document.getElementById('auth-screen').style.display = 'none';
            connectWS();
        } else {
            alert(data.detail || "Ошибка входа");
        }
    }

    // Соединение WebSocket
    function connectWS() {
        const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
        ws = new WebSocket(`${protocol}//${location.host}/ws/${currentUser}`);
        
        ws.onmessage = (e) => {
            const data = JSON.parse(e.data);
            if (data.chat_id === activeChatId) {
                renderMessage(data);
            }
        };
    }

    // Отрисовка сообщений
    function renderMessage(data) {
        const box = document.getElementById('messages');
        const div = document.createElement('div');
        div.className = `msg ${data.sender === currentUser ? 'my' : ''}`;
        
        let contentHTML = `<b>${data.sender}:</b><br>`;
        if (data.type === 'text') {
            contentHTML += data.content;
        } else if (data.type === 'voice') {
            contentHTML += `<audio controls src="${data.content}"></audio>`;
        } else if (data.type === 'circle') {
            contentHTML += `<video class="circle-video" src="${data.content}" autoplay loop muted playsinline></video>`;
        }
        
        div.innerHTML = contentHTML;
        box.appendChild(div);
        box.scrollTop = box.scrollHeight;
    }

    // Отправка текста
    function sendText() {
        const input = document.getElementById('msg-input');
        if (!input.value || !activeChatId) return;
        ws.send(JSON.stringify({ chat_id: activeChatId, type: 'text', content: input.value }));
        input.value = '';
    }

    // Запись голосового сообщения
    async function toggleVoice() {
        if (!activeChatId) return alert("Сначала выберите или создайте чат!");
        const btn = document.getElementById('voice-btn');
        
        if (!isRecordingVoice) {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            mediaRecorder = new MediaRecorder(stream);
            audioChunks = [];
            
            mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
            mediaRecorder.onstop = async () => {
                const blob = new Blob(audioChunks, { type: 'audio/webm' });
                const reader = new FileReader();
                reader.readAsDataURL(blob);
                reader.onloadend = () => {
                    ws.send(JSON.stringify({ chat_id: activeChatId, type: 'voice', content: reader.result }));
                };
            };
            
            mediaRecorder.start();
            isRecordingVoice = true;
            btn.classList.add('recording');
        } else {
            mediaRecorder.stop();
            isRecordingVoice = false;
            btn.classList.remove('recording');
        }
    }

    // Запись видеокружочка
    async function toggleCircle() {
        if (!activeChatId) return alert("Сначала выберите или создайте чат!");
        const btn = document.getElementById('circle-btn');
        
        if (!isRecordingCircle) {
            const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 300, height: 300 }, audio: true });
            mediaRecorder = new MediaRecorder(stream);
            videoChunks = [];
            
            mediaRecorder.ondataavailable = e => videoChunks.push(e.data);
            mediaRecorder.onstop = async () => {
                const blob = new Blob(videoChunks, { type: 'video/webm' });
                const reader = new FileReader();
                reader.readAsDataURL(blob);
                reader.onloadend = () => {
                    ws.send(JSON.stringify({ chat_id: activeChatId, type: 'circle', content: reader.result }));
                };
                stream.getTracks().forEach(track => track.stop());
            };
            
            mediaRecorder.start();
            isRecordingCircle = true;
            btn.classList.add('recording');
        } else {
            mediaRecorder.stop();
            isRecordingCircle = false;
            btn.classList.remove('recording');
        }
    }

    // Создание чатов
    async function createPrivate() {
        const target = prompt("Введите @username собеседника:");
        if (!target) return;
        const res = await fetch('/chats/private', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({sender_username: currentUser, target_username: target})
        });
        const data = await res.json();
        activeChatId = data.chat_id;
        alert(`Чат с ${target} создан! ID чата: ${data.chat_id}`);
    }

    async function createGroup() {
        const name = prompt("Название группы:");
        const membersStr = prompt("Участники через запятую (например: alex, max):");
        if (!name || !membersStr) return;
        const members = membersStr.split(',').map(m => m.trim());
        members.push(currentUser);
        
        const res = await fetch('/chats/group', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({name: name, members: members})
        });
        const data = await res.json();
        activeChatId = data.chat_id;
        alert(`Группа "${name}" создана! ID: ${data.chat_id}`);
    }
</script>
</body>
</html>
