<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Messenger</title>
    <style>
        :root {
            --bg-primary: #0a0e1a;
            --bg-secondary: #0f1525;
            --bg-tertiary: #141b2d;
            --bg-card: #1a2236;
            --bg-hover: #1e2a42;
            --accent: #6366f1;
            --accent-2: #8b5cf6;
            --accent-3: #a78bfa;
            --accent-glow: rgba(99,102,241,0.25);
            --accent-soft: rgba(99,102,241,0.12);
            --text-primary: #e2e8f0;
            --text-secondary: #94a3b8;
            --text-muted: #475569;
            --border: rgba(99,102,241,0.12);
            --border-hover: rgba(99,102,241,0.35);
            --success: #22c55e;
            --danger: #ef4444;
            --msg-in: #1a2236;
            --msg-out-start: #6366f1;
            --msg-out-end: #8b5cf6;
            --radius-sm: 10px;
            --radius-md: 16px;
            --radius-lg: 22px;
            --radius-xl: 28px;
            --shadow-sm: 0 2px 8px rgba(0,0,0,0.3);
            --shadow-md: 0 4px 20px rgba(0,0,0,0.4);
            --shadow-glow: 0 0 20px rgba(99,102,241,0.2);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif; }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(99,102,241,0.3); border-radius: 4px; }

        body {
            height: 100vh; width: 100vw; overflow: hidden;
            background: var(--bg-primary); color: var(--text-primary);
        }

        /* ═══════════════════════════════════════
           SPLASH SCREEN
        ═══════════════════════════════════════ */
        #splash-screen {
            position: fixed; inset: 0;
            background: var(--bg-primary);
            z-index: 1000; display: flex; flex-direction: column;
            justify-content: center; align-items: center; gap: 32px;
            transition: opacity 0.8s ease, visibility 0.8s ease;
        }
        #splash-screen.hidden { opacity: 0; visibility: hidden; pointer-events: none; }

        .splash-icon {
            width: 96px; height: 96px; border-radius: 28px;
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            display: flex; align-items: center; justify-content: center;
            font-size: 44px; box-shadow: 0 0 40px rgba(99,102,241,0.5);
            animation: floatUp 2s ease-in-out infinite;
        }
        .splash-title {
            font-size: 36px; font-weight: 800; letter-spacing: -1px;
            background: linear-gradient(135deg, #fff 0%, var(--accent-3) 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .splash-progress {
            width: 160px; height: 3px; background: rgba(99,102,241,0.15);
            border-radius: 99px; overflow: hidden;
        }
        .splash-progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--accent), var(--accent-2));
            border-radius: 99px;
            animation: loadBar 1.2s ease forwards;
        }
        @keyframes loadBar { 0% { width: 0%; } 100% { width: 100%; } }
        @keyframes floatUp { 0%,100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-8px) scale(1.03); } }
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes fadeInUp { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:translateY(0); } }
        @keyframes slideIn { from { opacity:0; transform:translateX(-12px); } to { opacity:1; transform:translateX(0); } }
        @keyframes msgPop { from { opacity:0; transform:scale(0.9) translateY(4px); } to { opacity:1; transform:scale(1) translateY(0); } }
        @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(99,102,241,0.4); } 50% { box-shadow: 0 0 0 8px rgba(99,102,241,0); } }

        /* ═══════════════════════════════════════
           AUTH SCREEN
        ═══════════════════════════════════════ */
        #auth-screen {
            position: fixed; inset: 0; z-index: 100;
            background: radial-gradient(ellipse at 30% 20%, rgba(99,102,241,0.1) 0%, transparent 60%),
                        radial-gradient(ellipse at 70% 80%, rgba(139,92,246,0.08) 0%, transparent 60%),
                        var(--bg-primary);
            display: flex; justify-content: center; align-items: center;
        }

        .auth-container {
            display: flex; flex-direction: column; align-items: center; gap: 24px;
            width: 90%; max-width: 400px;
            animation: fadeInUp 0.6s ease;
        }

        .auth-logo {
            width: 80px; height: 80px; border-radius: 24px;
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            display: flex; align-items: center; justify-content: center;
            font-size: 38px; box-shadow: 0 0 30px rgba(99,102,241,0.4);
        }

        .auth-box {
            background: var(--bg-card);
            padding: 36px 32px; border-radius: var(--radius-xl);
            border: 1px solid var(--border);
            display: flex; flex-direction: column; gap: 14px;
            width: 100%; box-shadow: var(--shadow-md), 0 0 0 1px rgba(255,255,255,0.03);
            backdrop-filter: blur(12px);
        }

        .auth-title {
            font-size: 26px; font-weight: 800; text-align: center;
            letter-spacing: -0.5px; color: var(--text-primary);
        }
        .auth-subtitle {
            font-size: 14px; text-align: center; color: var(--text-muted);
            margin-top: -8px; margin-bottom: 4px;
        }

        .input-group { display: flex; flex-direction: column; gap: 6px; }
        .input-label { font-size: 12px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; padding-left: 4px; }

        input[type="text"], input[type="password"] {
            background: rgba(10,14,26,0.8);
            color: var(--text-primary);
            padding: 14px 18px;
            border: 1.5px solid var(--border);
            border-radius: var(--radius-md);
            font-size: 15px; outline: none;
            width: 100%;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        input[type="text"]:focus, input[type="password"]:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-soft);
        }
        input::placeholder { color: var(--text-muted); }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            color: #fff; padding: 14px;
            border: none; border-radius: var(--radius-md);
            font-weight: 700; font-size: 15px; cursor: pointer;
            transition: transform 0.15s, box-shadow 0.2s;
            box-shadow: 0 4px 15px rgba(99,102,241,0.4);
        }
        .btn-primary:active { transform: scale(0.98); }
        .btn-primary:hover { box-shadow: 0 6px 20px rgba(99,102,241,0.5); }

        .btn-secondary {
            background: transparent; color: var(--text-secondary);
            padding: 13px; border: 1.5px solid var(--border);
            border-radius: var(--radius-md);
            font-weight: 600; font-size: 15px; cursor: pointer;
            transition: border-color 0.2s, background 0.2s;
        }
        .btn-secondary:hover { border-color: var(--border-hover); background: var(--accent-soft); }

        button { cursor: pointer; }

        /* ═══════════════════════════════════════
           MAIN APP LAYOUT
        ═══════════════════════════════════════ */
        #app { display: flex; width: 100%; height: 100%; }

        /* ═══════════════════════════════════════
           SIDEBAR
        ═══════════════════════════════════════ */
        #sidebar {
            width: 320px; min-width: 320px;
            background: var(--bg-secondary);
            border-right: 1px solid var(--border);
            display: flex; flex-direction: column;
            height: 100%; overflow: hidden;
        }

        .sidebar-header {
            padding: 16px; border-bottom: 1px solid var(--border);
            display: flex; flex-direction: column; gap: 12px;
        }

        .user-header {
            display: flex; align-items: center; gap: 12px;
        }

        .avatar-wrapper { position: relative; display: inline-block; flex-shrink: 0; }

        .avatar {
            width: 42px; height: 42px; border-radius: 50%;
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            display: flex; align-items: center; justify-content: center;
            font-weight: 800; color: #fff; overflow: hidden;
            font-size: 16px; cursor: pointer;
            border: 2px solid rgba(255,255,255,0.08);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .avatar:hover { transform: scale(1.05); box-shadow: var(--shadow-glow); }
        .avatar img { width: 100%; height: 100%; object-fit: cover; }
        .avatar-sm { width: 38px; height: 38px; font-size: 14px; }
        .avatar-xs { width: 28px; height: 28px; font-size: 11px; }

        .online-dot {
            width: 11px; height: 11px; border-radius: 50%;
            position: absolute; bottom: 1px; right: 1px;
            border: 2px solid var(--bg-secondary);
            transition: background 0.3s;
        }
        .online-dot.on { background: var(--success); box-shadow: 0 0 6px rgba(34,197,94,0.5); }
        .online-dot.off { background: var(--text-muted); }

        .user-info { flex-grow: 1; }
        .user-name { font-weight: 700; font-size: 14px; color: var(--text-primary); }
        .user-sub { font-size: 11px; color: var(--accent-3); margin-top: 2px; cursor: pointer; }

        .btn-logout {
            background: rgba(239,68,68,0.1); color: #fca5a5;
            padding: 7px 12px; font-size: 12px; font-weight: 600;
            border-radius: var(--radius-sm); border: 1px solid rgba(239,68,68,0.2);
            transition: background 0.2s;
        }
        .btn-logout:hover { background: rgba(239,68,68,0.2); }

        /* SEARCH */
        .search-wrapper {
            position: relative;
        }
        .search-icon {
            position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
            font-size: 14px; color: var(--text-muted);
        }
        .search-input {
            width: 100%; padding: 10px 12px 10px 36px !important;
            background: var(--bg-tertiary) !important;
            border-color: transparent !important;
            border-radius: var(--radius-md) !important;
            font-size: 14px !important;
        }
        .search-input:focus { border-color: var(--accent) !important; }

        /* TABS */
        .tabs {
            display: flex; gap: 4px;
            padding: 4px; background: var(--bg-tertiary);
            border-radius: var(--radius-md); margin: 0 16px 8px;
        }
        .tab {
            flex: 1; text-align: center; padding: 8px;
            font-size: 13px; font-weight: 600; border-radius: var(--radius-sm);
            cursor: pointer; color: var(--text-muted);
            transition: all 0.2s;
        }
        .tab.active {
            background: var(--bg-card); color: var(--text-primary);
            box-shadow: var(--shadow-sm);
        }

        /* ACTION BUTTONS */
        .action-btns { display: flex; gap: 8px; padding: 0 16px; }
        .btn-action {
            flex: 1; background: var(--accent-soft);
            color: var(--accent-3); border: 1px solid var(--border);
            border-radius: var(--radius-md); padding: 10px 8px;
            font-size: 13px; font-weight: 600;
            transition: all 0.2s;
        }
        .btn-action:hover { background: rgba(99,102,241,0.2); border-color: var(--border-hover); }

        /* CHATS LIST */
        #chats-tab-content, #friends-tab-content {
            display: flex; flex-direction: column;
            flex-grow: 1; overflow: hidden;
        }

        .list-wrapper {
            flex-grow: 1; overflow-y: auto; padding: 8px 12px 12px;
            display: flex; flex-direction: column; gap: 4px;
        }

        .list-label {
            font-size: 11px; font-weight: 700; text-transform: uppercase;
            letter-spacing: 0.8px; color: var(--text-muted);
            padding: 8px 4px 4px;
        }

        .chat-item {
            padding: 10px 12px;
            background: transparent; border-radius: var(--radius-md);
            cursor: pointer; display: flex; align-items: center; gap: 10px;
            border: 1px solid transparent;
            transition: all 0.18s ease; position: relative;
            animation: slideIn 0.3s ease;
        }
        .chat-item:hover { background: var(--bg-hover); border-color: var(--border); }
        .chat-item.active {
            background: var(--accent-soft); border-color: rgba(99,102,241,0.3);
        }
        .chat-item.active .chat-name { color: var(--text-primary); }

        .chat-info { flex-grow: 1; min-width: 0; }
        .chat-name { font-weight: 600; font-size: 14px; color: var(--text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .chat-preview { font-size: 12px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }

        .chat-meta { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
        .chat-time { font-size: 11px; color: var(--text-muted); }
        .unread-badge {
            background: var(--accent); color: #fff;
            font-size: 10px; font-weight: 700; padding: 2px 6px;
            border-radius: 99px; min-width: 18px; text-align: center;
        }

        .delete-btn {
            background: none; border: none; color: var(--text-muted);
            padding: 4px 6px; border-radius: 6px; font-size: 12px;
            opacity: 0; transition: opacity 0.2s, color 0.2s;
        }
        .chat-item:hover .delete-btn { opacity: 1; }
        .delete-btn:hover { color: var(--danger); }

        /* ═══════════════════════════════════════
           CHAT AREA
        ═══════════════════════════════════════ */
        #chat-area {
            flex-grow: 1; display: flex; flex-direction: column;
            background: var(--bg-primary); height: 100%; position: relative;
            overflow: hidden;
        }

        /* Background pattern */
        #chat-area::before {
            content: '';
            position: absolute; inset: 0;
            background-image: radial-gradient(circle, rgba(99,102,241,0.04) 1px, transparent 1px);
            background-size: 32px 32px;
            pointer-events: none;
        }

        /* CHAT HEADER */
        .chat-header {
            padding: 14px 18px;
            background: rgba(15,21,37,0.95);
            border-bottom: 1px solid var(--border);
            display: flex; align-items: center; gap: 12px;
            backdrop-filter: blur(20px);
            z-index: 5;
        }

        .chat-header-info { flex-grow: 1; }
        .chat-header-name { font-weight: 700; font-size: 15px; }
        .chat-header-status { font-size: 12px; color: var(--text-muted); margin-top: 1px; }

        .header-actions { display: flex; gap: 8px; }
        .header-icon-btn {
            width: 36px; height: 36px; border-radius: 10px;
            background: var(--accent-soft); border: 1px solid var(--border);
            display: flex; align-items: center; justify-content: center;
            font-size: 16px; cursor: pointer;
            transition: all 0.2s;
        }
        .header-icon-btn:hover { background: rgba(99,102,241,0.2); border-color: var(--border-hover); }

        /* EMPTY STATE */
        .empty-state {
            display: flex; flex-direction: column; align-items: center;
            justify-content: center; height: 100%; gap: 16px; color: var(--text-muted);
        }
        .empty-icon {
            width: 80px; height: 80px; border-radius: 24px;
            background: var(--accent-soft); border: 1px solid var(--border);
            display: flex; align-items: center; justify-content: center; font-size: 36px;
        }
        .empty-title { font-size: 20px; font-weight: 700; color: var(--text-secondary); }
        .empty-sub { font-size: 14px; text-align: center; max-width: 240px; line-height: 1.6; }

        /* MESSAGES */
        #messages {
            flex-grow: 1; overflow-y: auto;
            padding: 20px 16px; display: flex; flex-direction: column;
            gap: 6px; position: relative; z-index: 1;
        }

        .date-divider {
            text-align: center; margin: 8px 0;
        }
        .date-divider span {
            font-size: 11px; font-weight: 600; color: var(--text-muted);
            background: var(--bg-tertiary); padding: 4px 12px; border-radius: 99px;
        }

        .msg-wrapper {
            display: flex; gap: 8px; align-items: flex-end;
            max-width: 75%; animation: msgPop 0.25s ease;
        }
        .msg-wrapper.my { align-self: flex
