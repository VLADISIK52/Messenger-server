<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Мессенджер</title>
    <style>
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; 
        }
        
        body { 
            height: 100vh; 
            width: 100vw; 
            overflow: hidden; 
            background: linear-gradient(135deg, #0f1419 0%, #1a1f2e 100%); 
            color: #e1e7ec; 
        }

        /* ===== AUTH SCREEN ===== */
        #auth-screen { 
            position: fixed; 
            inset: 0; 
            background: linear-gradient(135deg, #0f1419 0%, #1a1f2e 100%);
            display: flex; 
            justify-content: center; 
            align-items: center; 
            z-index: 100; 
            backdrop-filter: blur(10px);
        }

        .auth-box { 
            background: linear-gradient(135deg, rgba(20, 27, 40, 0.95) 0%, rgba(15, 22, 35, 0.95) 100%); 
            backdrop-filter: blur(25px);
            padding: 40px; 
            border-radius: 24px; 
            border: 1px solid rgba(99, 102, 241, 0.25); 
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5),
                        inset 0 1px 1px rgba(255, 255, 255, 0.1),
                        0 0 40px rgba(99, 102, 241, 0.1); 
            display: flex; 
            flex-direction: column; 
            gap: 16px; 
            width: 90%; 
            max-width: 400px;
            animation: slideInUp 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .auth-box h2 { 
            background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-align: center; 
            font-size: 32px; 
            font-weight: 800; 
            margin-bottom: 16px;
            letter-spacing: -1px;
        }

        .auth-subtitle {
            text-align: center;
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 20px;
        }
        
        input { 
            background: linear-gradient(135deg, rgba(10, 15, 23, 0.7) 0%, rgba(10, 15, 23, 0.5) 100%);
            color: #fff; 
            padding: 14px 16px; 
            border: 1px solid rgba(99, 102, 241, 0.2); 
            border-radius: 12px; 
            font-size: 15px; 
            outline: none; 
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); 
            backdrop-filter: blur(10px);
        }

        input::placeholder {
            color: #64748b;
        }

        input:focus { 
            border-color: #6366f1; 
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2),
                        inset 0 0 0 1px rgba(99, 102, 241, 0.1),
                        0 0 20px rgba(99, 102, 241, 0.15); 
            background: linear-gradient(135deg, rgba(10, 15, 23, 0.9) 0%, rgba(10, 15, 23, 0.7) 100%);
        }
        
        button { 
            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%); 
            color: #fff; 
            padding: 12px 16px; 
            border: none; 
            border-radius: 12px; 
            font-weight: 600; 
            font-size: 15px; 
            cursor: pointer; 
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); 
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
            position: relative;
            overflow: hidden;
        }

        button::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        button:active::before {
            width: 300px;
            height: 300px;
        }

        button:hover { 
            transform: translateY(-2px); 
            box-shadow: 0 8px 25px rgba(99, 102, 241, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        button.sec { 
            background: linear-gradient(135deg, rgba(30, 41, 59, 0.7) 0%, rgba(20, 27, 40, 0.7) 100%);
            border: 1px solid rgba(99, 102, 241, 0.2); 
            color: #cbd5e1;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        }

        button.sec:hover {
            background: linear-gradient(135deg, rgba(30, 41, 59, 0.9) 0%, rgba(20, 27, 40, 0.9) 100%);
            border-color: rgba(99, 102, 241, 0.4);
            color: #e2e8f0;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.2);
            transform: translateY(-2px);
        }

        /* ===== MAIN APP ===== */
        #app { 
            display: flex; 
            width: 100%; 
            height: 100%; 
            position: relative; 
        }
        
        /* ===== SIDEBAR ===== */
        #sidebar { 
            width: 340px; 
            background: linear-gradient(180deg, rgba(15, 20, 25, 0.9) 0%, rgba(10, 15, 23, 0.95) 100%);
            backdrop-filter: blur(15px);
            border-right: 1px solid rgba(99, 102, 241, 0.1); 
            display: flex; 
            flex-direction: column; 
            padding: 12px; 
            gap: 12px; 
            height: 100%; 
            overflow: hidden;
        }

        #chat-area { 
            flex-grow: 1; 
            display: flex; 
            flex-direction: column; 
            background: linear-gradient(135deg, #0f1419 0%, #1a1f2e 100%);
            height: 100%; 
            position: relative; 
        }
        
        @media (max-width: 768px) {
            #sidebar { 
                width: 100%; 
                position: fixed; 
                inset: 0; 
                z-index: 10; 
            }
            #chat-area { 
                width: 100%; 
                height: 100%;
                position: fixed; 
                inset: 0; 
                z-index: 20; 
                display: none; 
                flex-direction: column;
                background: linear-gradient(135deg, #0f1419 0%, #1a1f2e 100%);
            }
            #chat-area.active { 
                display: flex !important; 
            }
        }

        .back-btn { 
            display: none; 
            background: rgba(30, 41, 59, 0.6); 
            border: 1px solid rgba(148, 163, 184, 0.2); 
            color: #94a3b8; 
            padding: 8px 14px; 
            font-size: 13px; 
            border-radius: 8px; 
            cursor: pointer; 
            margin-right: 10px;
            transition: all 0.2s ease;
        }

        .back-btn:hover {
            background: rgba(30, 41, 59, 0.8);
            color: #e2e8f0;
        }

        @media (max-width: 768px) { 
            .back-btn { 
                display: inline-flex;
                align-items: center;
                gap: 6px;
            } 
        }

        #chats-list, #friends-list { 
            display: flex; 
            flex-direction: column; 
            gap: 4px; 
            margin-top: 8px; 
            overflow-y: auto; 
            flex-grow: 1;
            padding-right: 4px;
        }

        #chats-list::-webkit-scrollbar,
        #friends-list::-webkit-scrollbar {
            width: 6px;
        }

        #chats-list::-webkit-scrollbar-track,
        #friends-list::-webkit-scrollbar-track {
            background: transparent;
        }

        #chats-list::-webkit-scrollbar-thumb,
        #friends-list::-webkit-scrollbar-thumb {
            background: rgba(148, 163, 184, 0.2);
            border-radius: 3px;
        }

        #chats-list::-webkit-scrollbar-thumb:hover,
        #friends-list::-webkit-scrollbar-thumb:hover {
            background: rgba(148, 163, 184, 0.4);
        }

        .chat-item { 
            padding: 12px 14px; 
            background: linear-gradient(135deg, rgba(20, 27, 40, 0.6) 0%, rgba(15, 22, 35, 0.6) 100%);
            border-radius: 12px; 
            cursor: pointer; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            font-weight: 500; 
            color: #cbd5e1; 
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); 
            border: 1px solid rgba(99, 102, 241, 0.1);
        }

        .chat-item:hover { 
            background: linear-gradient(135deg, rgba(30, 41, 59, 0.7) 0%, rgba(20, 27, 40, 0.7) 100%);
            border-color: rgba(99, 102, 241, 0.3);
            color: #fff;
            transform: translateX(4px);
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.1);
        }

        .chat-item.active { 
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.2) 0%, rgba(79, 70, 229, 0.15) 100%);
            border-color: rgba(99, 102, 241, 0.5); 
            color: #fff; 
            box-shadow: 0 0 0 1px rgba(99, 102, 241, 0.3), 0 4px 16px rgba(99, 102, 241, 0.15);
        }

        .del-btn { 
            background: transparent; 
            border: none; 
            color: #ef4444; 
            font-size: 16px; 
            padding: 2px 6px; 
            opacity: 0.6;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .del-btn:hover { 
            opacity: 1;
            transform: scale(1.1);
        }

        .online-dot { 
            width: 8px; 
            height: 8px; 
            border-radius: 50%; 
            display: inline-block; 
            margin-right: 8px; 
        }

        .online-dot.on { 
            background: #22c55e;
            box-shadow: 0 0 6px rgba(34, 197, 94, 0.5); 
        }

        .online-dot.off { 
            background: #64748b; 
        }

        /* ===== CHAT HEADER ===== */
        .chat-header { 
            padding: 14px 16px; 
            background: linear-gradient(180deg, rgba(20, 27, 40, 0.8) 0%, rgba(20, 27, 40, 0.4) 100%);
            backdrop-filter: blur(15px);
            border-bottom: 1px solid rgba(99, 102, 241, 0.1); 
            display: flex; 
            align-items: center; 
            flex-shrink: 0; 
            font-size: 16px; 
            font-weight: 600; 
            gap: 12px;
        }
        
        /* ===== MESSAGES ===== */
        #messages { 
            flex-grow: 1; 
            overflow-y: auto; 
            padding: 14px 12px;
            display: flex; 
            flex-direction: column; 
            gap: 4px;
            min-height: 0;
        }
        
        @media (max-width: 768px) {
            #messages {
                padding: 12px 8px;
            }
        }

        #messages::-webkit-scrollbar {
            width: 6px;
        }

        #messages::-webkit-scrollbar-track {
            background: transparent;
        }

        #messages::-webkit-scrollbar-thumb {
            background: rgba(148, 163, 184, 0.2);
            border-radius: 3px;
        }

        #messages::-webkit-scrollbar-thumb:hover {
            background: rgba(148, 163, 184, 0.4);
        }
        
        .msg { 
            max-width: 80%; 
            padding: 8px 12px; 
            border-radius: 14px; 
            background: linear-gradient(135deg, rgba(20, 27, 40, 0.9) 0%, rgba(15, 22, 35, 0.9) 100%);
            border: 1px solid rgba(99, 102, 241, 0.1); 
            align-self: flex-start; 
            word-wrap: break-word; 
            color: #e2e8f0; 
            font-size: 14px;
            line-height: 1.35;
            animation: slideIn 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(12px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .msg.my { 
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.9) 0%, rgba(79, 70, 229, 0.9) 100%);
            border: 1px solid rgba(99, 102, 241, 0.4);
            align-self: flex-end; 
            color: #fff;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.2);
        }

        .msg b { 
            color: #a5b4fc; 
            font-size: 10px; 
            display: block; 
            margin-bottom: 1px; 
            opacity: 0.8;
            font-weight: 700;
            letter-spacing: 0.3px;
        }

        .msg.my b { 
            color: #e0e7ff; 
        }

        .msg-meta { 
            display: flex; 
            justify-content: flex-end; 
            align-items: center; 
            gap: 2px; 
            font-size: 10px; 
            opacity: 0.6; 
            margin-top: 2px; 
        }

        .chat-img { 
            max-width: 100%; 
            border-radius: 8px; 
            margin-top: 4px; 
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .chat-img:hover {
            transform: scale(1.03);
        }

        .circle-video { 
            width: 120px; 
            height: 120px; 
            border-radius: 50%; 
            object-fit: cover; 
            border: 2px solid rgba(99, 102, 241, 0.5);
            margin-top: 4px; 
        }

        audio { 
            margin-top: 4px; 
            max-width: 200px;
            height: 28px;
        }

        /* ===== INPUT PANEL ===== */
        .input-panel { 
            padding: 12px 12px 16px 12px; 
            background: linear-gradient(180deg, rgba(20, 27, 40, 0.3) 0%, rgba(20, 27, 40, 0.95) 100%);
            backdrop-filter: blur(20px);
            border-top: 1px solid rgba(99, 102, 241, 0.1); 
            display: flex; 
            flex-direction: column;
            gap: 12px; 
            flex-shrink: 0;
            position: relative;
            z-index: 5;
        }

        .input-row {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .input-panel input { 
            flex-grow: 1; 
            border-radius: 24px; 
            padding: 12px 18px; 
            background: rgba(10, 15, 23, 0.9);
            border: 1px solid rgba(99, 102, 241, 0.2);
            font-size: 15px;
            transition: all 0.3s ease;
        }

        .input-panel input:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15),
                        inset 0 0 0 1px rgba(99, 102, 241, 0.1);
            background: rgba(10, 15, 23, 0.95);
        }

        .input-panel input:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .buttons-row {
            display: flex;
            gap: 8px;
            justify-content: flex-start;
            overflow-x: auto;
            padding-right: 4px;
        }

        .buttons-row::-webkit-scrollbar {
            height: 3px;
        }

        .buttons-row::-webkit-scrollbar-track {
            background: transparent;
        }

        .buttons-row::-webkit-scrollbar-thumb {
            background: rgba(148, 163, 184, 0.2);
            border-radius: 3px;
        }
        
        .icon-btn { 
            background: linear-gradient(135deg, rgba(30, 41, 59, 0.6) 0%, rgba(20, 27, 40, 0.6) 100%);
            border: 1px solid rgba(99, 102, 241, 0.2); 
            border-radius: 14px; 
            width: 44px; 
            height: 44px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            cursor: pointer; 
            font-size: 20px; 
            flex-shrink: 0; 
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        }

        .icon-btn:hover { 
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.3) 0%, rgba(79, 70, 229, 0.2) 100%);
            border-color: rgba(99, 102, 241, 0.5);
            color: #6366f1;
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(99, 102, 241, 0.2);
        }

        .icon-btn:active {
            transform: scale(0.95);
        }

        .recording { 
            background: linear-gradient(135deg, rgba(239, 68, 68, 0.9) 0%, rgba(220, 38, 38, 0.8) 100%) !important; 
            border-color: rgba(239, 68, 68, 0.6) !important; 
            color: white !important;
            animation: pulse 1s infinite;
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.4) !important;
        }

        .send-btn {
            padding: 12px 24px !important;
            border-radius: 14px !important;
            font-weight: 600 !important;
            font-size: 15px !important;
            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%) !important;
            border: none !important;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3) !important;
        }

        .send-btn:hover {
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.4) !important;
            transform: translateY(-2px) !important;
        }

        /* ===== TABS ===== */
        .tabs { 
            display: flex; 
            gap: 6px; 
            border-bottom: 1px solid rgba(99, 102, 241, 0.1); 
            padding-bottom: 10px;
        }

        .tab { 
            cursor: pointer; 
            opacity: 0.5; 
            padding: 8px 16px; 
            font-size: 13px; 
            font-weight: 700; 
            border-radius: 8px; 
            background: transparent;
            border: 1px solid transparent;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .tab:hover {
            opacity: 0.7;
            transform: translateY(-1px);
        }

        .tab.active { 
            opacity: 1;
            color: #6366f1;
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.15) 0%, rgba(79, 70, 229, 0.1) 100%);
            border-color: rgba(99, 102, 241, 0.3);
            box-shadow: 0 2px 8px rgba(99, 102, 241, 0.1);
        }

        /* ===== USER HEADER ===== */
        .user-header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 14px 14px; 
            border-bottom: 1px solid rgba(99, 102, 241, 0.1);
            background: linear-gradient(135deg, rgba(20, 27, 40, 0.7) 0%, rgba(15, 22, 35, 0.7) 100%);
            border-radius: 12px;
            margin-bottom: 6px;
            border: 1px solid rgba(99, 102, 241, 0.15);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .user-header span {
            font-weight: 700;
            color: #fff;
            font-size: 16px;
            letter-spacing: -0.5px;
        }

        .logout-btn { 
            background: linear-gradient(135deg, rgba(127, 29, 29, 0.4) 0%, rgba(120, 25, 25, 0.4) 100%);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
            padding: 6px 12px; 
            font-size: 12px; 
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-weight: 600;
            box-shadow: 0 2px 6px rgba(239, 68, 68, 0.1);
        }

        .logout-btn:hover {
            background: linear-gradient(135deg, rgba(127, 29, 29, 0.6) 0%, rgba(120, 25, 25, 0.6) 100%);
            border-color: rgba(239, 68, 68, 0.5);
            color: #f87171;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.2);
        }

        /* ===== ANIMATIONS ===== */
        @keyframes pulse { 
            0%, 100% { opacity: 1; } 
            50% { opacity: 0.6; } 
        }

        @keyframes slideInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes glow {
            0%, 100% { box-shadow: 0 0 10px rgba(99, 102, 241, 0.2); }
            50% { box-shadow: 0 0 20px rgba(99, 102, 241, 0.4); }
        }

        .input-panel {
            animation: slideInUp 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* ===== EMPTY STATE ===== */
        .empty-state {
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 20px;
            color: #64748b;
            animation: slideInUp 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .empty-state-icon {
            font-size: 80px;
            opacity: 0.25;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        .empty-state-text {
            text-align: center;
            font-size: 16px;
            font-weight: 500;
            color: #94a3b8;
        }
    </style>
</head>
<body>

<div id="auth-screen">
    <div class="auth-box">
        <h2>Messenger</h2>
        <p class="auth-subtitle">Быстрый и приватный чат</p>
        <input type="text" id="username" placeholder="Логин (@username)">
        <input type="password" id="password" placeholder="Пароль" onkeydown="if(event.key==='Enter') auth('login')">
        <button onclick="auth('login')">Войти</button>
        <button class="sec" onclick="auth('register')">Зарегистрироваться</button>
    </div>
</div>

<div id="app">
    <div id="sidebar">
        <div class="user-header">
            <span id="my-name">@user</span>
            <button class="logout-btn" onclick="logout()">Выйти</button>
        </div>

        <div class="tabs">
            <div class="tab active" id="tab-chats" onclick="switchTab('chats')">💬 Чаты</div>
            <div class="tab" id="tab-friends" onclick="switchTab('friends')">👥 Друзья</div>
        </div>

        <div id="chats-tab-content" style="display:flex; flex-direction:column; flex-grow:1; overflow:hidden; gap: 8px;">
            <button onclick="createPrivate()" style="width:100%">✏️ Написать</button>
            <button class="sec" onclick="createGroup()" style="width:100%">➕ Группа</button>
            <div id="chats-list"></div>
        </div>

        <div id="friends-tab-content" style="display:none; flex-direction:column; flex-grow:1; overflow:hidden; gap: 8px;">
            <button onclick="addFriendPrompt()" style="width:100%">➕ Добавить</button>
            <div id="friends-list"></div>
        </div>
    </div>
    
    <div id="chat-area">
        <div class="chat-header">
            <button class="back-btn" onclick="closeMobileChat()">← Назад</button>
            <span id="chat-title">Выберите чат</span>
        </div>

        <div id="messages">
            <div class="empty-state">
                <div class="empty-state-icon">💬</div>
                <div class="empty-state-text">Выберите чат чтобы начать</div>
            </div>
        </div>
        
        <div class="input-panel">
            <div class="input-row">
                <input type="text" id="msg-input" placeholder="Сообщение..." disabled onkeydown="if(event.key==='Enter') sendText()">
                <button class="icon-btn send-btn" onclick="sendText()" title="Отправить">⬆️</button>
            </div>
            <div class="buttons-row">
                <div class="icon-btn" onclick="document.getElementById('file-input').click()" title="Фото/Видео">📸</div>
                <input type="file" id="file-input" style="display:none" onchange="sendFile(this)" accept="image/*,video/*">
                <div class="icon-btn" id="voice-btn" title="Голосовое сообщение" onclick="toggleVoice()">🎙️</div>
                <div class="icon-btn" id="circle-btn" title="Видео круг" onclick="toggleCircle()">📹</div>
            </div>
        </div>
    </div>
</div>

<script>
    let currentUser = "";
    let ws = null;
    let activeChatId = null;
    let pollInterval = null;
    
    let mediaRecorder = null;
    let audioChunks = [];
    let videoChunks = [];
    let isRecordingVoice = false;
    let isRecordingCircle = false;

    document.addEventListener("DOMContentLoaded", () => {
        const savedUser = localStorage.getItem('messenger_user');
        if (savedUser) {
            currentUser = savedUser.toLowerCase();
            document.getElementById('auth-screen').style.display = 'none';
            document.getElementById('my-name').innerText = `@${currentUser}`;
            startApp();
        } else {
            document.getElementById('auth-screen').style.display = 'flex';
        }
    });

    function startApp() {
        connectWS();
        loadChats();
        loadFriends();
        if (!pollInterval) {
            pollInterval = setInterval(() => {
                if (activeChatId) fetchMessages(activeChatId, true);
                loadChats();
                loadFriends();
            }, 2000);
        }
    }

    async function auth(type) {
        const u = document.getElementById('username').value.trim().toLowerCase();
        const p = document.getElementById('password').value.trim();
        if(!u || !p) return alert("Заполните все поля!");

        try {
            const res = await fetch(`/${type}`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({username: u, password: p})
            });
            const data = await res.json();
            
            if (res.ok) {
                currentUser = u;
                localStorage.setItem('messenger_user', u);
                document.getElementById('auth-screen').style.display = 'none';
                document.getElementById('my-name').innerText = `@${currentUser}`;
                startApp();
            } else {
                alert(data.detail || "Ошибка входа");
            }
        } catch (e) { 
            alert("Ошибка подключения к серверу"); 
        }
    }

    function logout() {
        localStorage.removeItem('messenger_user');
        location.reload();
    }

    function connectWS() {
        if (!currentUser) return;
        const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
        ws = new WebSocket(`${protocol}//${location.host}/ws/${currentUser}`);
        
        ws.onmessage = (e) => {
            const data = JSON.parse(e.data);
            if (activeChatId && parseInt(data.chat_id) === parseInt(activeChatId)) {
                renderMessage(data);
            }
            loadChats();
        };

        ws.onclose = () => setTimeout(connectWS, 3000);
    }

    function switchTab(tab) {
        document.getElementById('tab-chats').classList.toggle('active', tab === 'chats');
        document.getElementById('tab-friends').classList.toggle('active', tab === 'friends');
        document.getElementById('chats-tab-content').style.display = tab === 'chats' ? 'flex' : 'none';
        document.getElementById('friends-tab-content').style.display = tab === 'friends' ? 'flex' : 'none';
    }

    async function loadChats() {
        if (!currentUser) return;
        try {
            const res = await fetch(`/chats/${currentUser}`);
            if (!res.ok) return;
            const chats = await res.json();
            const list = document.getElementById('chats-list');
            list.innerHTML = '';

            if (chats.length === 0) {
                list.innerHTML = '<div style="text-align:center; color:#64748b; padding:20px; font-size:13px;">Нет чатов</div>';
                return;
            }

            chats.forEach(chat => {
                const div = document.createElement('div');
                div.className = `chat-item ${chat.id === activeChatId ? 'active' : ''}`;
                
                const dotClass = chat.online ? 'on' : 'off';
                const dotHtml = chat.type === 'private' ? `<span class="online-dot ${dotClass}"></span>` : '';
                
                div.innerHTML = `
                    <span>${dotHtml}${chat.name}</span>
                    <button class="del-btn" onclick="deleteChat(event, ${chat.id})">✕</button>
                `;
                div.onclick = (e) => {
                    if(e.target.tagName !== 'BUTTON') {
                        console.log('Opening chat:', chat.id, chat.name);
                        openChat(chat.id, chat.name);
                    }
                };
                list.appendChild(div);
            });
        } catch (e) { console.error(e); }
    }

    async function deleteChat(event, chatId) {
        event.stopPropagation();
        if(!confirm("Удалить чат?")) return;
        await fetch(`/chats/${chatId}`, { method: 'DELETE' });
        if(activeChatId === chatId) {
            activeChatId = null;
            closeMobileChat();
        }
        loadChats();
    }

    async function loadFriends() {
        if (!currentUser) return;
        try {
            const res = await fetch(`/friends/${currentUser}`);
            if (!res.ok) return;
            const friends = await res.json();
            const list = document.getElementById('friends-list');
            list.innerHTML = '';

            if (friends.length === 0) {
                list.innerHTML = '<div style="text-align:center; color:#64748b; padding:20px; font-size:13px;">Нет друзей</div>';
                return;
            }

            friends.forEach(friend => {
                const div = document.createElement('div');
                div.className = 'chat-item';
                const dotClass = friend.online ? 'on' : 'off';
                div.innerHTML = `
                    <div style="display: flex; align-items: center;">
                        <span class="online-dot ${dotClass}"></span>
                        <span>@${friend.username}</span>
                    </div>
                `;
                div.onclick = () => startPrivateWith(friend.username);
                list.appendChild(div);
            });
        } catch (e) { console.error(e); }
    }

    async function addFriendPrompt() {
        const target = prompt("@username:");
        if (!target) return;
        const res = await fetch('/friends/add', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({username: currentUser, friend_username: target})
        });
        const data = await res.json();
        if(res.ok) {
            alert("✅ Друг добавлен!");
            loadFriends();
        } else { 
            alert(data.detail || "Ошибка"); 
        }
    }

    async function startPrivateWith(targetUsername) {
        const res = await fetch('/chats/private', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({sender_username: currentUser, target_username: targetUsername})
        });
        const data = await res.json();
        switchTab('chats');
        openChat(data.chat_id, `@${targetUsername}`);
    }

    async function openChat(chatId, title = "Чат") {
        activeChatId = chatId;
        document.getElementById('msg-input').disabled = false;
        document.getElementById('msg-input').placeholder = "Сообщение...";
        document.getElementById('chat-title').innerText = title;
        document.getElementById('chat-area').classList.add('active');
        
        loadChats();
        await fetchMessages(chatId, false);
    }

    function closeMobileChat() {
        activeChatId = null;
        document.getElementById('chat-area').classList.remove('active');
        document.getElementById('msg-input').disabled = true;
        document.getElementById('messages').innerHTML = '<div class="empty-state"><div class="empty-state-icon">💬</div><div class="empty-state-text">Выберите чат</div></div>';
        document.getElementById('chat-title').innerText = 'Выберите чат';
    }

    let lastMessagesHash = "";
    async function fetchMessages(chatId, isBackground = false) {
        try {
            const res = await fetch(`/messages/${chatId}/${currentUser}`);
            if (!res.ok) {
                console.error("Failed to fetch messages:", res.status);
                return;
            }
            
            const messages = await res.json();
            
            const currentHash = JSON.stringify(messages);
            if (isBackground && currentHash === lastMessagesHash) return;
            lastMessagesHash = currentHash;

            const box = document.getElementById('messages');
            box.innerHTML = '';
            
            if (!messages || messages.length === 0) {
                box.innerHTML = '<div class="empty-state" style="margin-top: 30px;"><div class="empty-state-icon">👋</div><div class="empty-state-text">Начните разговор</div></div>';
                return;
            }
            
            messages.forEach((msg, index) => {
                setTimeout(() => {
                    renderMessage(msg);
                }, index * 10);
            });
        } catch(e) { 
            console.error("Error fetching messages:", e); 
        }
    }

    function renderMessage(data) {
        const box = document.getElementById('messages');
        
        // Remove empty state if it exists (only on first message)
        if (box.querySelector('.empty-state')) {
            box.innerHTML = '';
        }

        const div = document.createElement('div');
        div.className = `msg ${data.sender === currentUser ? 'my' : ''}`;
        
        let contentHTML = `<b>${data.sender}</b>`;
        if (data.type === 'text') {
            contentHTML += data.content;
        } else if (data.type === 'image') {
            contentHTML += `<img src="${data.content}" class="chat-img" onclick="window.open(this.src)">`;
        } else if (data.type === 'voice') {
            contentHTML += `<audio controls src="${data.content}"></audio>`;
        } else if (data.type === 'circle') {
            contentHTML += `<video class="circle-video" src="${data.content}" autoplay loop muted playsinline></video>`;
        }
        
        let statusTag = '';
        if (data.sender === currentUser) {
            statusTag = data.is_read ? '✓✓' : '✓';
        }
        
        if (statusTag) {
            contentHTML += `<div class="msg-meta">${statusTag}</div>`;
        }
        
        div.innerHTML = contentHTML;
        box.appendChild(div);
        
        // Scroll to bottom
        setTimeout(() => {
            box.scrollTop = box.scrollHeight;
        }, 0);
    }

    function sendText() {
        const input = document.getElementById('msg-input');
        if (!input.value.trim() || !activeChatId) {
            if (!activeChatId) console.warn('No active chat selected');
            if (!input.value.trim()) console.warn('Empty message');
            return;
        }
        
        const text = input.value.trim();
        input.value = '';

        if (ws && ws.readyState === WebSocket.OPEN) {
            console.log('Sending message:', { chat_id: activeChatId, type: 'text', content: text });
            ws.send(JSON.stringify({ chat_id: activeChatId, type: 'text', content: text }));
        } else {
            console.error('WebSocket not connected, state:', ws?.readyState);
            alert('Ошибка подключения. Попробуйте еще раз.');
        }
    }

    function sendFile(input) {
        if (!input.files || !input.files[0] || !activeChatId) return;
        const file = input.files[0];
        const reader = new FileReader();
        reader.onload = function(e) {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ chat_id: activeChatId, type: 'image', content: e.target.result }));
            }
        };
        reader.readAsDataURL(file);
        input.value = '';
    }

    async function toggleVoice() {
        if (!activeChatId) return alert("Сначала выберите чат!");
        const btn = document.getElementById('voice-btn');
        
        if (!isRecordingVoice) {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];
                
                mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                mediaRecorder.onstop = async () => {
                    const blob = new Blob(audioChunks, { type: 'audio/webm' });
                    const reader = new FileReader();
                    reader.readAsDataURL(blob);
                    reader.onloadend = () => {
                        if (ws && ws.readyState === WebSocket.OPEN) {
                            ws.send(JSON.stringify({ chat_id: activeChatId, type: 'voice', content: reader.result }));
                        }
                    };
                    stream.getTracks().forEach(track => track.stop());
                };
                
                mediaRecorder.start();
                isRecordingVoice = true;
                btn.classList.add('recording');
            } catch(e) { alert("❌ Ошибка микрофона"); }
        } else {
            mediaRecorder.stop();
            isRecordingVoice = false;
            btn.classList.remove('recording');
        }
    }

    async function toggleCircle() {
        if (!activeChatId) return alert("Сначала выберите чат!");
        const btn = document.getElementById('circle-btn');
        
        if (!isRecordingCircle) {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 200, height: 200 }, audio: true });
                mediaRecorder = new MediaRecorder(stream);
                videoChunks = [];
                
                mediaRecorder.ondataavailable = e => videoChunks.push(e.data);
                mediaRecorder.onstop = async () => {
                    const blob = new Blob(videoChunks, { type: 'video/webm' });
                    const reader = new FileReader();
                    reader.readAsDataURL(blob);
                    reader.onloadend = () => {
                        if (ws && ws.readyState === WebSocket.OPEN) {
                            ws.send(JSON.stringify({ chat_id: activeChatId, type: 'circle', content: reader.result }));
                        }
                    };
                    stream.getTracks().forEach(track => track.stop());
                };
                
                mediaRecorder.start();
                isRecordingCircle = true;
                btn.classList.add('recording');
            } catch(e) { alert("❌ Ошибка камеры"); }
        } else {
            mediaRecorder.stop();
            isRecordingCircle = false;
            btn.classList.remove('recording');
        }
    }

    async function createPrivate() {
        const target = prompt("@username:");
        if (!target) return;
        startPrivateWith(target.toLowerCase());
    }

    async function createGroup() {
        const name = prompt("Название группы:");
        if (!name) return;
        const membersStr = prompt("Логины через запятую:");
        if (!membersStr) return;
        const members = membersStr.split(',').map(m => m.trim().toLowerCase());
        members.push(currentUser);
        
        const res = await fetch('/chats/group', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({name: name, members: members})
        });
        const data = await res.json();
        openChat(data.chat_id, `👥 ${name}`);
    }
</script>
</body>
</html>
