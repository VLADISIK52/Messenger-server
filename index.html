<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Messenger</title>
    <style>
        :root {
            --bg-primary: #0a0e1a;
            --bg-secondary: #0f1525;
            --bg-tertiary: #141b2d;
            --bg-card: #1a2236;
            --bg-hover: #1e2a42;
            --accent: #6366f1;
            --accent-2: #8b5cf6;
            --accent-3: #a78bfa;
            --accent-glow: rgba(99,102,241,0.25);
            --accent-soft: rgba(99,102,241,0.12);
            --text-primary: #e2e8f0;
            --text-secondary: #94a3b8;
            --text-muted: #475569;
            --border: rgba(99,102,241,0.12);
            --border-hover: rgba(99,102,241,0.35);
            --msg-in: #1a2236;
            --msg-out-start: #6366f1;
            --msg-out-end: #8b5cf6;
            --radius-sm: 10px;
            --radius-md: 16px;
            --radius-lg: 22px;
            --radius-xl: 28px;
            --shadow-md: 0 4px 20px rgba(0,0,0,0.4);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif; }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(99,102,241,0.3); border-radius: 4px; }

        body {
            height: 100vh; width: 100vw; overflow: hidden;
            background: var(--bg-primary); color: var(--text-primary);
        }

        /* SPLASH SCREEN */
        #splash-screen {
            position: fixed; inset: 0;
            background: var(--bg-primary);
            z-index: 1000; display: flex; flex-direction: column;
            justify-content: center; align-items: center; gap: 32px;
            transition: opacity 0.8s ease, visibility 0.8s ease;
        }
        #splash-screen.hidden { opacity: 0; visibility: hidden; pointer-events: none; }

        .splash-icon {
            width: 96px; height: 96px; border-radius: 28px;
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            display: flex; align-items: center; justify-content: center;
            font-size: 44px; box-shadow: 0 0 40px rgba(99,102,241,0.5);
            animation: floatUp 2s ease-in-out infinite;
        }
        .splash-title {
            font-size: 36px; font-weight: 800; letter-spacing: -1px;
            background: linear-gradient(135deg, #fff 0%, var(--accent-3) 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .splash-progress {
            width: 160px; height: 3px; background: rgba(99,102,241,0.15);
            border-radius: 99px; overflow: hidden;
        }
        .splash-progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--accent), var(--accent-2));
            border-radius: 99px;
            animation: loadBar 1.2s ease forwards;
        }
        @keyframes loadBar { 0% { width: 0%; } 100% { width: 100%; } }
        @keyframes floatUp { 0%,100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-8px) scale(1.03); } }
        @keyframes fadeInUp { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:translateY(0); } }
        @keyframes msgPop { from { opacity:0; transform:scale(0.9) translateY(4px); } to { opacity:1; transform:scale(1) translateY(0); } }

        /* AUTH SCREEN */
        #auth-screen {
            position: fixed; inset: 0; z-index: 100;
            background: radial-gradient(ellipse at 30% 20%, rgba(99,102,241,0.1) 0%, transparent 60%),
                        radial-gradient(ellipse at 70% 80%, rgba(139,92,246,0.08) 0%, transparent 60%),
                        var(--bg-primary);
            display: flex; justify-content: center; align-items: center;
        }

        .auth-container {
            display: flex; flex-direction: column; align-items: center; gap: 24px;
            width: 90%; max-width: 400px;
            animation: fadeInUp 0.6s ease;
        }

        .auth-logo {
            width: 80px; height: 80px; border-radius: 24px;
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            display: flex; align-items: center; justify-content: center;
            font-size: 38px; box-shadow: 0 0 30px rgba(99,102,241,0.4);
        }

        .auth-box {
            background: var(--bg-card);
            padding: 36px 32px; border-radius: var(--radius-xl);
            border: 1px solid var(--border);
            display: flex; flex-direction: column; gap: 14px;
            width: 100%; box-shadow: var(--shadow-md), 0 0 0 1px rgba(255,255,255,0.03);
            backdrop-filter: blur(12px);
        }

        .auth-title { font-size: 26px; font-weight: 800; text-align: center; color: var(--text-primary); }
        .auth-subtitle { font-size: 14px; text-align: center; color: var(--text-muted); margin-top: -8px; }

        .input-group { display: flex; flex-direction: column; gap: 6px; }
        .input-label { font-size: 12px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; padding-left: 4px; }

        input[type="text"], input[type="password"] {
            background: rgba(10,14,26,0.8);
            color: var(--text-primary);
            padding: 14px 18px;
            border: 1.5px solid var(--border);
            border-radius: var(--radius-md);
            font-size: 15px; outline: none; width: 100%;
            transition: border-color 0.2s;
        }
        input[type="text"]:focus, input[type="password"]:focus { border-color: var(--accent); }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            color: #fff; padding: 14px; border: none; border-radius: var(--radius-md);
            font-weight: 700; font-size: 15px; cursor: pointer;
            box-shadow: 0 4px 15px rgba(99,102,241,0.4);
        }
        .btn-primary:active { transform: scale(0.98); }

        /* MAIN APP LAYOUT */
        #app { display: flex; width: 100%; height: 100%; position: relative; }

        /* SIDEBAR */
        #sidebar {
            width: 320px; min-width: 320px;
            background: var(--bg-secondary);
            border-right: 1px solid var(--border);
            display: flex; flex-direction: column; height: 100%;
            z-index: 2; transition: transform 0.3s ease;
        }

        .sidebar-header { padding: 16px; border-bottom: 1px solid var(--border); display: flex; flex-direction: column; gap: 12px; }
        .user-header { display: flex; align-items: center; gap: 12px; }

        .avatar {
            width: 42px; height: 42px; border-radius: 50%;
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            display: flex; align-items: center; justify-content: center;
            font-weight: 800; color: #fff; overflow: hidden; font-size: 16px;
            border: 2px solid rgba(255,255,255,0.08); flex-shrink: 0;
        }

        .user-info { flex-grow: 1; }
        .user-name { font-weight: 700; font-size: 14px; color: var(--text-primary); }
        .user-sub { font-size: 11px; color: var(--accent-3); margin-top: 2px; }

        /* ADD USER BAR */
        .add-user-bar {
            padding: 12px 16px; display: flex; gap: 8px; border-bottom: 1px solid var(--border);
        }
        .add-user-bar input {
            flex: 1; padding: 10px 14px; background: var(--bg-tertiary);
            border: 1px solid var(--border); border-radius: var(--radius-sm); color: var(--text-primary); outline: none; font-size: 13px;
        }
        .add-user-bar button {
            background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #fff;
            border: none; border-radius: var(--radius-sm); padding: 0 16px; font-weight: bold; cursor: pointer;
        }

        .list-wrapper { flex-grow: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
        .chat-item {
            padding: 12px; background: var(--bg-tertiary); border-radius: var(--radius-md);
            cursor: pointer; display: flex; align-items: center; gap: 12px; border: 1px solid var(--border);
            transition: background 0.2s, border-color 0.2s;
        }
        .chat-item:hover, .chat-item.active { background: var(--accent-soft); border-color: var(--accent); }

        /* CHAT AREA */
        #chat-area {
            flex-grow: 1; display: flex; flex-direction: column;
            background: var(--bg-primary); height: 100%; position: relative;
            z-index: 1;
        }
        .chat-header {
            padding: 14px 18px; background: rgba(15,21,37,0.95);
            border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; backdrop-filter: blur(20px);
        }
        .btn-back {
            display: none; background: transparent; border: none;
            color: var(--accent-3); font-size: 22px; cursor: pointer; padding-right: 4px;
        }
        .chat-header-name { font-weight: 700; font-size: 15px; }
        .chat-header-status { font-size: 12px; color: var(--accent-3); height: 14px; }

        #messages { flex-grow: 1; overflow-y: auto; padding: 20px 16px; display: flex; flex-direction: column; gap: 10px; }

        .msg-wrapper { display: flex; flex-direction: column; max-width: 85%; animation: msgPop 0.2s ease; }
        .msg-wrapper.my { align-self: flex-end; }
        .msg-wrapper.other { align-self: flex-start; }

        .msg-bubble {
            padding: 10px 14px; border-radius: var(--radius-md); font-size: 14px; line-height: 1.4; word-break: break-word;
        }
        .msg-wrapper.my .msg-bubble { background: linear-gradient(135deg, var(--msg-out-start), var(--msg-out-end)); color: #fff; }
        .msg-wrapper.other .msg-bubble { background: var(--msg-in); color: var(--text-primary); border: 1px solid var(--border); }

        .msg-sender { font-size: 11px; font-weight: 700; color: var(--text-muted); margin-bottom: 4px; }
        .msg-img { max-width: 240px; border-radius: 8px; margin-top: 4px; cursor: pointer; }

        /* INPUT BAR */
        .input-container {
            padding: 12px 16px; background: var(--bg-secondary); border-top: 1px solid var(--border);
            display: flex; gap: 10px; align-items: center;
        }
        .input-container input[type="text"] {
            flex: 1; padding: 12px 16px; background: var(--bg-tertiary);
            border: 1px solid var(--border); border-radius: var(--radius-md); color: var(--text-primary); outline: none;
        }
        .btn-icon {
            background: var(--accent-soft); border: 1px solid var(--border); color: var(--accent-3);
            width: 42px; height: 42px; border-radius: var(--radius-md); font-size: 18px;
            display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0;
        }
        .btn-send {
            background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #fff;
            padding: 0 20px; height: 42px; border: none; border-radius: var(--radius-md);
            font-weight: 700; cursor: pointer; flex-shrink: 0;
        }

        #lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); justify-content: center; align-items: center; z-index: 2000; }
        #lightbox img { max-width: 90%; max-height: 90%; border-radius: 12px; }

        /* ADAPTIVE MOBILE FIX */
        @media (max-width: 768px) {
            #sidebar { width: 100%; min-width: 100%; position: absolute; inset: 0; }
            #chat-area { width: 100%; position: absolute; inset: 0; display: none; }
            #app.mobile-chat-active #sidebar { display: none; }
            #app.mobile-chat-active #chat-area { display: flex; }
            .btn-back { display: block; }
        }
    </style>
</head>
<body>

<div id="splash-screen">
    <div class="splash-icon">💬</div>
    <div class="splash-title">Messenger</div>
    <div class="splash-progress"><div class="splash-progress-bar"></div></div>
</div>

<div id="auth-screen">
    <div class="auth-container">
        <div class="auth-logo">💬</div>
        <div class="auth-box">
            <div class="auth-title">Вход в чат</div>
            <div class="auth-subtitle">Укажите данные для авторизации</div>
            <div class="input-group">
                <div class="input-label">Имя пользователя</div>
                <input type="text" id="username-input" placeholder="Введите логин...">
            </div>
            <div class="input-group">
                <div class="input-label">Пароль</div>
                <input type="password" id="password-input" placeholder="Введите пароль...">
            </div>
            <button class="btn-primary" onclick="login()">Войти</button>
        </div>
    </div>
</div>

<div id="app">
    <div id="sidebar">
        <div class="sidebar-header">
            <div class="user-header">
                <div class="avatar" id="my-avatar-letter">?</div>
                <div class="user-info">
                    <div class="user-name" id="my-username">Гость</div>
                    <div class="user-sub">В сети</div>
                </div>
            </div>
        </div>
        
        <!-- НОВОЕ: Блок ручного добавления собеседника -->
        <div class="add-user-bar">
            <input type="text" id="new-chat-input" placeholder="Логин друга..." onkeypress="if(event.key==='Enter') startNewChat()">
            <button onclick="startNewChat()">+</button>
        </div>

        <div class="list-wrapper" id="users-list">
            <!-- Список пользователей будет грузиться сюда -->
        </div>
    </div>

    <div id="chat-area">
        <div class="chat-header">
            <button class="btn-back" onclick="closeChat()">←</button>
            <div class="avatar" id="target-avatar-letter">?</div>
            <div>
                <div class="chat-header-name" id="target-username">Выберите чат</div>
                <div class="chat-header-status" id="typing-status"></div>
            </div>
        </div>

        <div id="messages"></div>

        <div class="input-container">
            <input type="file" id="file-input" style="display:none" onchange="sendFile(this)">
            <button class="btn-icon" onclick="document.getElementById('file-input').click()">📁</button>
            <input type="text" id="msg-input" placeholder="Напишите сообщение..." onkeypress="if(event.key==='Enter') sendMessage()">
            <button class="btn-send" onclick="sendMessage()">Отправить</button>
        </div>
    </div>
</div>

<div id="lightbox" onclick="this.style.display='none'">
    <img id="lightbox-img" src="">
</div>

<script>
    let ws;
    let currentUser = "";
    let activeChatUser = "";
    let typingTimeout;

    setTimeout(() => {
        document.getElementById('splash-screen').classList.add('hidden');
    }, 1200);

    async function login() {
        const username = document.getElementById('username-input').value.trim();
        const password = document.getElementById('password-input').value.trim();
        if (!username) return alert("Введите имя!");

        const formData = new FormData();
        formData.append("username", username);

        try {
            const res = await fetch("/register", { method: "POST", body: formData });
            const data = await res.json();
            currentUser = data.username;
        } catch (e) {
            // Если бэкенд отвалился, все равно пускаем локально для теста интерфейса
            currentUser = username; 
        }

        document.getElementById('my-username').innerText = currentUser;
        document.getElementById('my-avatar-letter').innerText = currentUser.charAt(0).toUpperCase();
        document.getElementById('auth-screen').style.display = 'none';

        initWS();
        loadUsers();
    }

    function initWS() {
        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        try {
            ws = new WebSocket(`${protocol}//${window.location.host}/ws/${currentUser}`);

            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);

                if (data.type === 'typing' && data.sender === activeChatUser) {
                    document.getElementById('typing-status').innerText = `@${data.sender} печатает...`;
                } else if (data.type === 'stop_typing' && data.sender === activeChatUser) {
                    document.getElementById('typing-status').innerText = '';
                } else if (data.type === 'message') {
                    if (data.sender === activeChatUser || data.sender === currentUser) {
                        document.getElementById('typing-status').innerText = '';
                        appendMessage(data);
                    }
                }
            };
        } catch (e) {
            console.log("WebSocket не подключен, сервер недоступен");
        }
    }

    // Загрузка юзеров с сервера
    async function loadUsers() {
        try {
            const res = await fetch('/users');
            const users = await res.json();
            users.filter(u => u !== currentUser).forEach(user => {
                addUserToList(user);
            });
        } catch (e) {
            console.log("Не удалось загрузить список юзеров с сервера");
        }
    }

    // Ручное добавление чата через форму
    function startNewChat() {
        const input = document.getElementById('new-chat-input');
        const user = input.value.trim();
        if (user && user !== currentUser) {
            addUserToList(user);
            selectUser(user);
            input.value = '';
        }
    }

    // Добавление карточки чата в левое меню
    function addUserToList(user) {
        if (document.getElementById('chat-item-' + user)) return; // Уже есть

        const container = document.getElementById('users-list');
        const item = document.createElement('div');
        item.id = 'chat-item-' + user;
        item.className = `chat-item ${user === activeChatUser ? 'active' : ''}`;
        item.onclick = () => selectUser(user);
        item.innerHTML = `
            <div class="avatar">${user.charAt(0).toUpperCase()}</div>
            <div>
                <div style="font-weight:700">${user}</div>
                <div style="font-size:12px; color:var(--text-muted)">Личный чат</div>
            </div>
        `;
        container.prepend(item);
    }

    // Переключение чатов
    function selectUser(user) {
        activeChatUser = user;
        document.getElementById('target-username').innerText = user;
        document.getElementById('target-avatar-letter').innerText = user.charAt(0).toUpperCase();
        document.getElementById('app').classList.add('mobile-chat-active');
        
        // Подсветка активного чата
        document.querySelectorAll('.chat-item').forEach(el => el.classList.remove('active'));
        if (document.getElementById('chat-item-' + user)) {
            document.getElementById('chat-item-' + user).classList.add('active');
        }
        
        loadHistory();
    }

    function closeChat() {
        document.getElementById('app').classList.remove('mobile-chat-active');
    }

    async function loadHistory() {
        if (!activeChatUser) return;
        try {
            const res = await fetch(`/messages/${activeChatUser}`);
            const messages = await res.json();
            document.getElementById('messages').innerHTML = '';
            messages.forEach(msg => appendMessage(msg));
        } catch(e) {
            document.getElementById('messages').innerHTML = '';
        }
    }

    document.getElementById('msg-input').addEventListener('input', () => {
        if (!ws || !activeChatUser) return;
        try {
            ws.send(JSON.stringify({ type: 'typing', target: activeChatUser }));
            clearTimeout(typingTimeout);
            typingTimeout = setTimeout(() => {
                ws.send(JSON.stringify({ type: 'stop_typing', target: activeChatUser }));
            }, 1500);
        } catch(e) {}
    });

    function sendMessage() {
        const input = document.getElementById('msg-input');
        const text = input.value.trim();
        if (!text || !activeChatUser) return;

        if (ws && ws.readyState === WebSocket.OPEN) {
            ws.send(JSON.stringify({
                type: 'message',
                target: activeChatUser,
                content: text,
                msg_type: 'text'
            }));
        } else {
            // Фейковая отправка если сервер оффлайн (чтобы видеть свой текст)
            appendMessage({sender: currentUser, content: text, msg_type: 'text'});
        }

        input.value = '';
    }

    async function sendFile(input) {
        const file = input.files[0];
        if (!file || !activeChatUser) return;

        const formData = new FormData();
        formData.append("file", file);

        try {
            const res = await fetch("/upload", { method: "POST", body: formData });
            const data = await res.json();
            const isImage = file.type.startsWith("image/");
            ws.send(JSON.stringify({
                type: 'message',
                target: activeChatUser,
                content: data.file_url,
                msg_type: isImage ? 'image' : 'file'
            }));
        } catch(e) {
            alert("Ошибка загрузки файла");
        }
    }

    function appendMessage(msg) {
        const box = document.getElementById('messages');
        const isMy = msg.sender === currentUser;
        
        const wrapper = document.createElement('div');
        wrapper.className = `msg-wrapper ${isMy ? 'my' : 'other'}`;

        let contentHtml = '';
        if (msg.msg_type === 'text') {
            contentHtml = `<div>${msg.content}</div>`;
        } else if (msg.msg_type === 'image') {
            contentHtml = `<img src="${msg.content}" class="msg-img" onclick="openLightbox(this.src)">`;
        } else if (msg.msg_type === 'file') {
            contentHtml = `<a href="${msg.content}" target="_blank" style="color:var(--accent-3)">📁 Файл</a>`;
        }

        wrapper.innerHTML = `
            <div class="msg-sender">${msg.sender}</div>
            <div class="msg-bubble">${contentHtml}</div>
        `;

        box.appendChild(wrapper);
        box.scrollTop = box.scrollHeight;
    }

    function openLightbox(src) {
        document.getElementById('lightbox-img').src = src;
        document.getElementById('lightbox').style.display = 'flex';
    }
</script>

</body>
</html>
