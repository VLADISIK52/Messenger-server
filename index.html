<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Messenger</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { display: flex; height: 100vh; background: #0e1621; color: #fff; overflow: hidden; }

        #auth-screen { position: fixed; inset: 0; background: #0e1621; display: flex; justify-content: center; align-items: center; z-index: 100; }
        .auth-box { background: #17212b; padding: 25px; border-radius: 12px; display: flex; flex-direction: column; gap: 12px; width: 90%; max-width: 320px; }
        input, button { padding: 12px; border-radius: 8px; border: none; font-size: 14px; outline: none; }
        input { background: #242f3d; color: #fff; }
        button { background: #5288c1; color: #fff; font-weight: bold; cursor: pointer; }
        button.sec { background: #242f3d; }

        #app { display: flex; width: 100%; height: 100%; position: relative; }
        #sidebar { width: 320px; border-right: 1px solid #242f3d; display: flex; flex-direction: column; padding: 15px; gap: 10px; background: #17212b; }
        #chat-area { flex-grow: 1; display: flex; flex-direction: column; background: #0e1621; }
        
        /* Мобильная адаптация */
        @media (max-width: 768px) {
            #sidebar { width: 100%; position: absolute; inset: 0; z-index: 10; }
            #chat-area { width: 100%; position: absolute; inset: 0; z-index: 20; display: none; }
            #chat-area.active { display: flex; }
        }

        .back-btn { display: none; background: #242f3d; padding: 6px 12px; border-radius: 6px; font-size: 14px; margin-right: 10px; cursor: pointer; }
        @media (max-width: 768px) { .back-btn { display: inline-block; } }

        #chats-list, #friends-list { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; overflow-y: auto; }
        .chat-item { padding: 12px; background: #242f3d; border-radius: 8px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        .chat-item:hover, .chat-item.active { background: #2b5278; }
        .del-btn { background: transparent; color: #ff5252; font-size: 16px; padding: 2px 6px; }

        #messages { flex-grow: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .msg { max-width: 80%; padding: 10px 14px; border-radius: 12px; background: #182533; align-self: flex-start; word-wrap: break-word; }
        .msg.my { background: #2b5278; align-self: flex-end; }
        
        .circle-video { width: 160px; height: 160px; border-radius: 50%; object-fit: cover; border: 3px solid #5288c1; margin-top: 5px; }
        audio { margin-top: 5px; max-width: 200px; }

        .chat-header { padding: 10px 15px; background: #17212b; border-bottom: 1px solid #242f3d; display: flex; align-items: center; }
        .input-panel { padding: 10px 15px; background: #17212b; display: flex; gap: 8px; align-items: center; }
        .input-panel input { flex-grow: 1; }
        .icon-btn { background: #242f3d; border-radius: 50%; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 18px; flex-shrink: 0; }
        .recording { background: #e53935 !important; animation: pulse 1s infinite; }

        .tabs { display: flex; gap: 10px; border-bottom: 1px solid #242f3d; padding-bottom: 10px; }
        .tab { cursor: pointer; opacity: 0.6; padding: 4px 8px; }
        .tab.active { opacity: 1; border-bottom: 2px solid #5288c1; }

        .user-header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 10px; border-bottom: 1px solid #242f3d; }
        .logout-btn { background: #e53935; padding: 5px 10px; font-size: 12px; }

        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
    </style>
</head>
<body>

<div id="auth-screen">
    <div class="auth-box">
        <h3 style="text-align:center">Мессенджер</h3>
        <input type="text" id="username" placeholder="Имя пользователя (@username)">
        <input type="password" id="password" placeholder="Пароль">
        <button onclick="auth('login')">Войти</button>
        <button class="sec" onclick="auth('register')">Зарегистрироваться</button>
    </div>
</div>

<div id="app">
    <div id="sidebar">
        <div class="user-header">
            <span id="my-name" style="font-weight:bold"></span>
            <button class="logout-btn" onclick="logout()">Выйти</button>
        </div>

        <div class="tabs" style="margin-top:10px">
            <div class="tab active" id="tab-chats" onclick="switchTab('chats')">Чаты</div>
            <div class="tab" id="tab-friends" onclick="switchTab('friends')">Друзья</div>
        </div>

        <div id="chats-tab-content">
            <button onclick="createPrivate()" style="width:100%; margin-bottom:5px; margin-top:10px">+ Написать в ЛС</button>
            <button class="sec" onclick="createGroup()" style="width:100%">+ Создать группу</button>
            <div id="chats-list"></div>
        </div>

        <div id="friends-tab-content" style="display:none">
            <button onclick="addFriendPrompt()" style="width:100%; margin-top:10px">+ Добавить друга</button>
            <div id="friends-list"></div>
        </div>
    </div>
    
    <div id="chat-area">
        <div class="chat-header">
            <span class="back-btn" onclick="closeMobileChat()">⬅ Назад</span>
            <span id="chat-title" style="font-weight:bold">Выберите чат</span>
        </div>

        <div id="messages"></div>
        
        <div class="input-panel">
            <input type="text" id="msg-input" placeholder="Сообщение..." disabled onkeydown="if(event.key==='Enter') sendText()">
            <button onclick="sendText()">➤</button>
            <div class="icon-btn" id="voice-btn" onclick="toggleVoice()">🎤</div>
            <div class="icon-btn" id="circle-btn" onclick="toggleCircle()">📷</div>
        </div>
    </div>
</div>

<script>
    let currentUser = "";
    let ws = null;
    let activeChatId = null;
    let pollInterval = null;
    
    let mediaRecorder = null;
    let audioChunks = [];
    let videoChunks = [];
    let isRecordingVoice = false;
    let isRecordingCircle = false;

    document.addEventListener("DOMContentLoaded", () => {
        const savedUser = localStorage.getItem('messenger_user');
        if (savedUser) {
            currentUser = savedUser.toLowerCase();
            document.getElementById('auth-screen').style.display = 'none';
            document.getElementById('my-name').innerText = `@${currentUser}`;
            startApp();
        } else {
            document.getElementById('auth-screen').style.display = 'flex';
        }
    });

    function startApp() {
        connectWS();
        loadChats();
        loadFriends();
        // Автоматическое обновление каждые 2 секунды (гарантия для мобилок)
        if (!pollInterval) {
            pollInterval = setInterval(() => {
                if (activeChatId) fetchMessages(activeChatId, true);
                loadChats();
            }, 2000);
        }
    }

    async function auth(type) {
        const u = document.getElementById('username').value.trim().toLowerCase();
        const p = document.getElementById('password').value.trim();
        if(!u || !p) return alert("Заполните все поля");

        try {
            const res = await fetch(`/${type}`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({username: u, password: p})
            });
            const data = await res.json();
            
            if (res.ok) {
                currentUser = u;
                localStorage.setItem('messenger_user', u);
                document.getElementById('auth-screen').style.display = 'none';
                document.getElementById('my-name').innerText = `@${currentUser}`;
                startApp();
            } else {
                alert(data.detail || "Ошибка");
            }
        } catch (e) {
            alert("Ошибка подключения к серверу");
        }
    }

    function logout() {
        localStorage.removeItem('messenger_user');
        location.reload();
    }

    function connectWS() {
        if (!currentUser) return;
        const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
        ws = new WebSocket(`${protocol}//${location.host}/ws/${currentUser}`);
        
        ws.onmessage = (e) => {
            const data = JSON.parse(e.data);
            if (activeChatId && parseInt(data.chat_id) === parseInt(activeChatId)) {
                renderMessage(data);
            }
            loadChats();
        };

        ws.onclose = () => setTimeout(connectWS, 3000);
    }

    function switchTab(tab) {
        document.getElementById('tab-chats').classList.toggle('active', tab === 'chats');
        document.getElementById('tab-friends').classList.toggle('active', tab === 'friends');
        document.getElementById('chats-tab-content').style.display = tab === 'chats' ? 'block' : 'none';
        document.getElementById('friends-tab-content').style.display = tab === 'friends' ? 'block' : 'none';
    }

    async function loadChats() {
        if (!currentUser) return;
        try {
            const res = await fetch(`/chats/${currentUser}`);
            if (!res.ok) return;
            const chats = await res.json();
            const list = document.getElementById('chats-list');
            list.innerHTML = '';

            chats.forEach(chat => {
                const div = document.createElement('div');
                div.className = `chat-item ${chat.id === activeChatId ? 'active' : ''}`;
                div.innerHTML = `
                    <span>${chat.name}</span>
                    <button class="del-btn" onclick="deleteChat(event, ${chat.id})">🗑️</button>
                `;
                div.onclick = (e) => {
                    if(e.target.tagName !== 'BUTTON') openChat(chat.id, chat.name);
                };
                list.appendChild(div);
            });
        } catch (e) {}
    }

    async function deleteChat(event, chatId) {
        event.stopPropagation();
        if(!confirm("Удалить этот чат?")) return;
        await fetch(`/chats/${chatId}`, { method: 'DELETE' });
        if(activeChatId === chatId) {
            activeChatId = null;
            closeMobileChat();
        }
        loadChats();
    }

    async function loadFriends() {
        if (!currentUser) return;
        try {
            const res = await fetch(`/friends/${currentUser}`);
            if (!res.ok) return;
            const friends = await res.json();
            const list = document.getElementById('friends-list');
            list.innerHTML = '';

            friends.forEach(friend => {
                const div = document.createElement('div');
                div.className = 'chat-item';
                div.innerText = `@${friend}`;
                div.onclick = () => startPrivateWith(friend);
                list.appendChild(div);
            });
        } catch (e) {}
    }

    async function addFriendPrompt() {
        const target = prompt("Введите @username друга:");
        if (!target) return;
        const res = await fetch('/friends/add', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({username: currentUser, friend_username: target})
        });
        const data = await res.json();
        if(res.ok) {
            alert("Друг добавлен!");
            loadFriends();
        } else {
            alert(data.detail);
        }
    }

    async function startPrivateWith(targetUsername) {
        const res = await fetch('/chats/private', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({sender_username: currentUser, target_username: targetUsername})
        });
        const data = await res.json();
        switchTab('chats');
        openChat(data.chat_id, `@${targetUsername}`);
    }

    async function openChat(chatId, title = "Чат") {
        activeChatId = chatId;
        document.getElementById('msg-input').disabled = false;
        document.getElementById('chat-title').innerText = title;
        document.getElementById('chat-area').classList.add('active');
        
        loadChats();
        fetchMessages(chatId, false);
    }

    function closeMobileChat() {
        activeChatId = null;
        document.getElementById('chat-area').classList.remove('active');
        document.getElementById('messages').innerHTML = '';
        document.getElementById('msg-input').disabled = true;
    }

    let lastMessagesCount = 0;
    async function fetchMessages(chatId, isBackground = false) {
        try {
            const res = await fetch(`/messages/${chatId}`);
            const messages = await res.json();
            
            if (isBackground && messages.length === lastMessagesCount) return;
            lastMessagesCount = messages.length;

            const box = document.getElementById('messages');
            box.innerHTML = '';
            messages.forEach(msg => renderMessage(msg));
        } catch(e) {}
    }

    function renderMessage(data) {
        const box = document.getElementById('messages');
        const div = document.createElement('div');
        div.className = `msg ${data.sender === currentUser ? 'my' : ''}`;
        
        let contentHTML = `<b>${data.sender}:</b><br>`;
        if (data.type === 'text') {
            contentHTML += data.content;
        } else if (data.type === 'voice') {
            contentHTML += `<audio controls src="${data.content}"></audio>`;
        } else if (data.type === 'circle') {
            contentHTML += `<video class="circle-video" src="${data.content}" autoplay loop muted playsinline></video>`;
        }
        
        div.innerHTML = contentHTML;
        box.appendChild(div);
        box.scrollTop = box.scrollHeight;
    }

    function sendText() {
        const input = document.getElementById('msg-input');
        if (!input.value.trim() || !activeChatId) return;
        
        const text = input.value.trim();
        input.value = '';

        if (ws && ws.readyState === WebSocket.OPEN) {
            ws.send(JSON.stringify({ chat_id: activeChatId, type: 'text', content: text }));
        }
    }

    async function toggleVoice() {
        if (!activeChatId) return alert("Сначала выберите чат!");
        const btn = document.getElementById('voice-btn');
        
        if (!isRecordingVoice) {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];
                
                mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                mediaRecorder.onstop = async () => {
                    const blob = new Blob(audioChunks, { type: 'audio/webm' });
                    const reader = new FileReader();
                    reader.readAsDataURL(blob);
                    reader.onloadend = () => {
                        ws.send(JSON.stringify({ chat_id: activeChatId, type: 'voice', content: reader.result }));
                    };
                };
                
                mediaRecorder.start();
                isRecordingVoice = true;
                btn.classList.add('recording');
            } catch(e) { alert("Ошибка доступа к микрофону"); }
        } else {
            mediaRecorder.stop();
            isRecordingVoice = false;
            btn.classList.remove('recording');
        }
    }

    async function toggleCircle() {
        if (!activeChatId) return alert("Сначала выберите чат!");
        const btn = document.getElementById('circle-btn');
        
        if (!isRecordingCircle) {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 200, height: 200 }, audio: true });
                mediaRecorder = new MediaRecorder(stream);
                videoChunks = [];
                
                mediaRecorder.ondataavailable = e => videoChunks.push(e.data);
                mediaRecorder.onstop = async () => {
                    const blob = new Blob(videoChunks, { type: 'video/webm' });
                    const reader = new FileReader();
                    reader.readAsDataURL(blob);
                    reader.onloadend = () => {
                        ws.send(JSON.stringify({ chat_id: activeChatId, type: 'circle', content: reader.result }));
                    };
                    stream.getTracks().forEach(track => track.stop());
                };
                
                mediaRecorder.start();
                isRecordingCircle = true;
                btn.classList.add('recording');
            } catch(e) { alert("Ошибка доступа к камере"); }
        } else {
            mediaRecorder.stop();
            isRecordingCircle = false;
            btn.classList.remove('recording');
        }
    }

    async function createPrivate() {
        const target = prompt("Введите @username собеседника:");
        if (!target) return;
        startPrivateWith(target.toLowerCase());
    }

    async function createGroup() {
        const name = prompt("Название группы:");
        const membersStr = prompt("Участники через запятую (например: alex, max):");
        if (!name || !membersStr) return;
        const members = membersStr.split(',').map(m => m.trim().toLowerCase());
        members.push(currentUser);
        
        const res = await fetch('/chats/group', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({name: name, members: members})
        });
        const data = await res.json();
        openChat(data.chat_id, `👥 ${name}`);
    }
</script>
</body>
</html>
