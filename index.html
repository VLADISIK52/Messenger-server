<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Messenger</title>
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
    <meta name="theme-color" content="#0a0812">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-void: #0a0812; --bg-panel: #120f1c; --bg-elevated: #1a1626; --bg-input: #221c31;
            --accent-a: #ff6a5c; --accent-b: #7c5cff;
            --accent-grad: linear-gradient(135deg, var(--accent-a), var(--accent-b));
            --accent-soft: rgba(124,92,255,0.14);
            --text-primary: #f3f0fb; --text-secondary: #a99fc9; --text-muted: #5f5578;
            --border: rgba(124,92,255,0.16);
            --glass: rgba(255,255,255,0.04);
            --msg-in: #1a1626;
            --radius-sm: 12px; --radius-md: 18px; --radius-xl: 30px; --radius-pill: 999px;
            --check-read: #5cc8ff;
            --danger: #ff5470;
            --online: #3ddc97;
            --shadow-soft: 0 8px 30px rgba(0,0,0,0.35);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: rgba(124,92,255,0.3); border-radius: 4px; }

        body, html { height: 100%; height: 100dvh; width: 100vw; overflow: hidden; color: var(--text-primary);
            background: radial-gradient(1200px 600px at 80% -10%, rgba(124,92,255,0.12), transparent 60%),
                        radial-gradient(900px 500px at -10% 110%, rgba(255,106,92,0.08), transparent 60%),
                        var(--bg-void); }

        h1, h2, h3, .display-font { font-family: 'Sora', 'Inter', sans-serif; }

        #splash-screen { position: fixed; inset: 0; background: var(--bg-void); z-index: 1000; display: flex; flex-direction: column; justify-content: center; align-items: center; transition: opacity 0.8s ease, visibility 0.8s; overflow: hidden; }
        #splash-screen.hidden { opacity: 0; visibility: hidden; }
        #splash-screen::before, #auth-screen::before {
            content: ''; position: absolute; width: 480px; height: 480px; border-radius: 50%;
            background: radial-gradient(circle, rgba(255,106,92,0.35) 0%, rgba(124,92,255,0.25) 45%, transparent 70%);
            filter: blur(24px); animation: auroraDrift 9s ease-in-out infinite; z-index: 0;
        }
        @keyframes auroraDrift {
            0%, 100% { transform: translate(-10%, -6%) scale(1); }
            50% { transform: translate(10%, 8%) scale(1.15); }
        }
        #splash-screen.hidden::before { animation-play-state: paused; }
        .splash-icon { width: 96px; height: 96px; border-radius: 28px; background: var(--accent-grad); display: flex; align-items: center; justify-content: center; font-size: 44px; position: relative; z-index: 1; box-shadow: 0 20px 50px rgba(124,92,255,0.35); }

        #auth-screen { display: none; position: fixed; inset: 0; z-index: 100; background: var(--bg-void); justify-content: center; align-items: center; overflow: hidden; }
        .auth-box { background: rgba(18,15,28,0.85); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); padding: 40px 32px; border-radius: 32px; border: 1px solid rgba(255,255,255,0.08); display: flex; flex-direction: column; gap: 14px; width: 90%; max-width: 400px; position: relative; z-index: 1; box-shadow: 0 30px 80px rgba(0,0,0,0.5); }
        .auth-title { font-family: 'Sora', sans-serif; font-size: 26px; font-weight: 800; text-align: center; }
        .auth-hint { text-align: center; font-size: 12px; color: var(--text-muted); margin-top: -6px; }
        .auth-error { text-align: center; font-size: 13px; color: var(--danger); min-height: 16px; }
        input[type="text"], input[type="password"], textarea { background: var(--bg-input); color: var(--text-primary); padding: 14px 18px; border: 1.5px solid var(--border); border-radius: var(--radius-md); font-size: 15px; outline: none; width: 100%; transition: border-color 0.15s, box-shadow 0.15s; }
        textarea { resize: none; font-family: inherit; }
        input:focus, textarea:focus { border-color: var(--accent-b); box-shadow: 0 0 0 3px rgba(124,92,255,0.15); }
        .btn-primary { background: var(--accent-grad); color: #fff; padding: 14px; border: none; border-radius: var(--radius-pill); font-weight: 700; font-family: 'Sora', sans-serif; cursor: pointer; transition: transform 0.12s, box-shadow 0.12s; box-shadow: 0 8px 24px rgba(124,92,255,0.3); }
        .btn-primary:active { transform: scale(0.97); }
        .btn-primary:disabled { opacity: 0.6; }
        .btn-secondary { background: transparent; color: var(--text-muted); border: 1px solid var(--border); padding: 12px; border-radius: var(--radius-pill); font-weight: 600; cursor: pointer; }
        .btn-danger-text { background: transparent; color: var(--danger); border: 1px solid rgba(255,84,112,0.3); padding: 12px; border-radius: var(--radius-pill); font-weight: 600; cursor: pointer; }

        #app { display: flex; width: 100%; height: 100%; position: relative; }
        #sidebar { width: 320px; min-width: 320px; background: rgba(18,15,28,0.7); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-right: 1px solid var(--border); display: flex; flex-direction: column; z-index: 2; }
        .sidebar-header { padding: 18px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
        .user-header-left { display: flex; align-items: center; gap: 12px; cursor: pointer; border-radius: var(--radius-md); padding: 4px; margin: -4px; transition: background 0.15s; flex: 1; min-width: 0; }
        .user-header-left:active { background: var(--bg-elevated); }
        .avatar { width: 42px; height: 42px; border-radius: 50%; background: var(--accent-grad); display: flex; align-items: center; justify-content: center; font-weight: 800; font-family: 'Sora', sans-serif; font-size: 16px; flex-shrink: 0; overflow: hidden; box-shadow: 0 4px 14px rgba(124,92,255,0.35); }
        .avatar img { width: 100%; height: 100%; object-fit: cover; }
        .avatar-sm { width: 30px; height: 30px; font-size: 12px; box-shadow: none; }
        .avatar-lg { width: 88px; height: 88px; font-size: 30px; box-shadow: 0 12px 30px rgba(124,92,255,0.3); }
        .user-info { flex-grow: 1; min-width: 0; }
        .user-name { font-weight: 700; font-size: 15px; }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 4px; }
        .online-dot { background: var(--online); box-shadow: 0 0 8px rgba(61,220,151,0.6); }
        .offline-dot { background: var(--text-muted); }
        .user-sub { font-size: 12px; color: var(--text-secondary); margin-top: 2px; display: flex; align-items: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .btn-logout { background: transparent; border: none; font-size: 20px; cursor: pointer; color: var(--text-muted); flex-shrink: 0; }

        .add-user-bar { padding: 12px 16px; display: flex; gap: 8px; border-bottom: 1px solid var(--border); position: relative; }
        .add-user-bar input { flex: 1; padding: 10px 16px; background: var(--bg-input); border: 1px solid var(--border); border-radius: var(--radius-pill); color: var(--text-primary); outline: none; }
        .add-user-bar button { background: var(--accent-grad); color: #fff; border: none; border-radius: var(--radius-pill); padding: 0 14px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 14px rgba(124,92,255,0.3); }

        .search-suggestions {
            position: absolute; top: 100%; left: 16px; right: 16px;
            background: rgba(26,22,38,0.95); border: 1px solid var(--border);
            border-radius: var(--radius-md); margin-top: 4px;
            max-height: 240px; overflow-y: auto; z-index: 10;
            box-shadow: var(--shadow-soft); display: none;
        }
        .search-suggestions.open { display: block; }
        .search-suggestion-item { display: flex; align-items: center; gap: 10px; padding: 10px 14px; cursor: pointer; transition: background 0.12s; }
        .search-suggestion-item:hover, .search-suggestion-item:active { background: var(--bg-input); }
        .search-suggestion-name { flex: 1; font-weight: 600; font-size: 14px; }
        .search-suggestion-empty { padding: 14px; text-align: center; color: var(--text-muted); font-size: 13px; }

        .list-wrapper { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
        .section-title { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-muted); font-weight: 700; margin: 8px 4px 4px 4px; }
        .chat-item { padding: 12px; background: var(--glass); border-radius: 20px; cursor: pointer; display: flex; align-items: center; justify-content: space-between; border: 1px solid transparent; border-left: 3px solid transparent; transition: border-color 0.15s, background 0.15s, transform 0.12s; }
        .chat-item:hover { background: rgba(255,255,255,0.06); }
        .chat-item:active { transform: scale(0.985); }
        .chat-item.active { background: rgba(124,92,255,0.18); border-left: 3px solid var(--accent-b); }
        .chat-item-left { display: flex; align-items: center; gap: 12px; min-width: 0; }
        .chat-item-right { display: flex; align-items: center; gap: 8px; }
        .btn-delete-chat { background: transparent; border: none; color: var(--text-muted); font-size: 16px; cursor: pointer; padding: 4px; }
        .unread-badge { background: var(--accent-grad); color: #fff; font-size: 11px; font-weight: 800; min-width: 20px; height: 20px; border-radius: var(--radius-pill); display: flex; align-items: center; justify-content: center; padding: 0 6px; box-shadow: 0 4px 12px rgba(255,106,92,0.35); }

        #chat-area { flex-grow: 1; display: flex; flex-direction: column; background: transparent; }
        .chat-header { padding: 12px 16px; background: rgba(26,22,38,0.7); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 14px; flex-shrink: 0; position: relative; }
        .chat-header::after { content: ''; position: absolute; left: 0; right: 0; bottom: -1px; height: 1px; background: linear-gradient(90deg, transparent, rgba(124,92,255,0.4), transparent); }
        .chat-header-info { display: flex; align-items: center; gap: 14px; flex: 1; min-width: 0; cursor: pointer; }
        .chat-header-info .user-name, .chat-header-info .user-sub { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .btn-back { display: none; background: transparent; border: none; color: var(--accent-b); font-size: 22px; cursor: pointer; }
        .btn-header-icon { background: var(--glass); border: 1px solid var(--border); color: var(--text-secondary); font-size: 17px; cursor: pointer; padding: 8px; flex-shrink: 0; border-radius: 50%; width: 38px; height: 38px; display: flex; align-items: center; justify-content: center; transition: background 0.15s; }
        .btn-header-icon:active { background: var(--accent-soft); }

        #search-bar { display: none; align-items: center; gap: 8px; padding: 10px 16px; background: rgba(18,15,28,0.9); border-bottom: 1px solid var(--border); flex-shrink: 0; }
        #search-bar.active { display: flex; }
        #search-input { flex: 1; padding: 8px 14px; background: var(--bg-input); border: 1px solid var(--border); border-radius: var(--radius-pill); color: var(--text-primary); outline: none; font-size: 14px; }
        #search-nav { font-size: 12px; color: var(--text-secondary); white-space: nowrap; }
        .btn-search-nav { background: transparent; border: none; color: var(--text-secondary); font-size: 16px; cursor: pointer; padding: 2px 4px; }
        .msg-bubble.search-match { outline: 2px solid var(--accent-a); }
        .msg-bubble.search-current { outline: 2px solid #fff; }

        #load-older-indicator { text-align: center; font-size: 12px; color: var(--text-muted); padding: 6px 0; display: none; }
        #load-older-indicator.active { display: block; }

        #messages { flex: 1; min-height: 0; overflow-y: auto; padding: 20px 16px; display: flex; flex-direction: column; gap: 4px; transition: opacity 0.15s ease; }
        .msg-wrapper { display: flex; flex-direction: column; max-width: 85%; animation-duration: 0.32s; animation-timing-function: cubic-bezier(0.34, 1.56, 0.64, 1); animation-fill-mode: both; position: relative; margin-bottom: 8px; }
        .msg-wrapper.my { align-self: flex-end; animation-name: msgInRight; }
        .msg-wrapper.other { align-self: flex-start; animation-name: msgInLeft; }
        .msg-wrapper.no-anim { animation: none !important; }
        @keyframes msgInRight { from { opacity: 0; transform: translate(18px, 8px) scale(0.94); } to { opacity: 1; transform: none; } }
        @keyframes msgInLeft { from { opacity: 0; transform: translate(-18px, 8px) scale(0.94); } to { opacity: 1; transform: none; } }

        .msg-row { display: flex; align-items: center; gap: 6px; }
        .msg-wrapper.my .msg-row { flex-direction: row-reverse; }
        .msg-bubble-touch-zone { touch-action: pan-y; }
        .msg-bubble { padding: 10px 16px; font-size: 14px; line-height: 1.45; word-break: break-word; position: relative; transition: transform 0.15s ease; }
        .msg-wrapper.my .msg-bubble { background: var(--accent-grad); color: #fff; border-radius: 22px 22px 6px 22px; box-shadow: 0 6px 20px rgba(124,92,255,0.28); }
        .msg-wrapper.other .msg-bubble { background: #1a1626; border: 1px solid var(--border); border-radius: 22px 22px 22px 6px; box-shadow: 0 4px 14px rgba(0,0,0,0.25); }
        .msg-sender { font-size: 12px; font-weight: 700; color: var(--text-muted); margin-bottom: 4px; }
        .msg-img { max-width: 240px; border-radius: 16px; margin-top: 4px; cursor: pointer; display: block; }
        .msg-deleted { opacity: 0.65; font-style: italic; }
        .msg-edited { font-size: 10px; opacity: 0.7; margin-right: 4
