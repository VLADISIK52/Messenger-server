<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Мессенджер</title>
    <style>
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; 
        }
        
        body { 
            height: 100vh; 
            width: 100vw; 
            overflow: hidden; 
            background: linear-gradient(135deg, #0f1419 0%, #1a1f2e 100%); 
            color: #e1e7ec; 
        }

        /* ===== SPLASH SCREEN ANIMATION ===== */
        #splash-screen {
            position: fixed;
            inset: 0;
            background: #0f1419;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.8s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.8s;
        }

        #splash-screen.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .splash-logo {
            font-size: 64px;
            font-weight: 900;
            background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: pulseGlow 2s infinite ease-in-out, zoomIn 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            letter-spacing: -2px;
            margin-bottom: 20px;
        }

        .splash-loader {
            width: 48px;
            height: 48px;
            border: 4px solid rgba(99, 102, 241, 0.2);
            border-left-color: #6366f1;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes pulseGlow {
            0%, 100% { transform: scale(1); filter: drop-shadow(0 0 15px rgba(99, 102, 241, 0.4)); }
            50% { transform: scale(1.05); filter: drop-shadow(0 0 35px rgba(168, 85, 247, 0.7)); }
        }

        @keyframes zoomIn {
            from { opacity: 0; transform: scale(0.5); }
            to { opacity: 1; transform: scale(1); }
        }

        /* ===== AUTH SCREEN ===== */
        #auth-screen { 
            position: fixed; 
            inset: 0; 
            background: linear-gradient(135deg, #0f1419 0%, #1a1f2e 100%);
            display: flex; 
            justify-content: center; 
            align-items: center; 
            z-index: 100; 
            backdrop-filter: blur(10px);
        }

        .auth-box { 
            background: linear-gradient(135deg, rgba(20, 27, 40, 0.95) 0%, rgba(15, 22, 35, 0.95) 100%); 
            backdrop-filter: blur(25px);
            padding: 40px; 
            border-radius: 24px; 
            border: 1px solid rgba(99, 102, 241, 0.25); 
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5),
                        inset 0 1px 1px rgba(255, 255, 255, 0.1),
                        0 0 40px rgba(99, 102, 241, 0.1); 
            display: flex; 
            flex-direction: column; 
            gap: 16px; 
            width: 90%; 
            max-width: 400px;
            animation: slideInUp 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .auth-box h2 { 
            background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-align: center; 
            font-size: 32px; 
            font-weight: 800; 
            margin-bottom: 8px;
            letter-spacing: -1px;
        }

        .auth-subtitle {
            text-align: center;
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 12px;
        }
        
        input { 
            background: linear-gradient(135deg, rgba(10, 15, 23, 0.7) 0%, rgba(10, 15, 23, 0.5) 100%);
            color: #fff; 
            padding: 14px 16px; 
            border: 1px solid rgba(99, 102, 241, 0.2); 
            border-radius: 12px; 
            font-size: 15px; 
            outline: none; 
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); 
            backdrop-filter: blur(10px);
        }

        input::placeholder {
            color: #64748b;
        }

        input:focus { 
            border-color: #6366f1; 
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2),
                        inset 0 0 0 1px rgba(99, 102, 241, 0.1),
                        0 0 20px rgba(99, 102, 241, 0.15); 
            background: linear-gradient(135deg, rgba(10, 15, 23, 0.9) 0%, rgba(10, 15, 23, 0.7) 100%);
        }
        
        button { 
            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%); 
            color: #fff; 
            padding: 12px 16px; 
            border: none; 
            border-radius: 12px; 
            font-weight: 600; 
            font-size: 15px; 
            cursor: pointer; 
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); 
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
            position: relative;
            overflow: hidden;
        }

        button:hover { 
            transform: translateY(-2px); 
            box-shadow: 0 8px 25px rgba(99, 102, 241, 0.4);
        }

        button.sec { 
            background: linear-gradient(135deg, rgba(30, 41, 59, 0.7) 0%, rgba(20, 27, 40, 0.7) 100%);
            border: 1px solid rgba(99, 102, 241, 0.2); 
            color: #cbd5e1;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        }

        button.sec:hover {
            background: linear-gradient(135deg, rgba(30, 41, 59, 0.9) 0%, rgba(20, 27, 40, 0.9) 100%);
            border-color: rgba(99, 102, 241, 0.4);
            color: #e2e8f0;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.2);
            transform: translateY(-2px);
        }

        /* ===== MAIN APP ===== */
        #app { 
            display: flex; 
            width: 100%; 
            height: 100%; 
            position: relative; 
        }
        
        /* ===== AVATARS ===== */
        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            color: #fff;
            font-size: 16px;
            flex-shrink: 0;
            object-fit: cover;
            border: 2px solid rgba(255, 255, 255, 0.1);
            text-transform: uppercase;
        }

        .avatar-sm {
            width: 32px;
            height: 32px;
            font-size: 13px;
        }

        /* ===== SIDEBAR ===== */
        #sidebar { 
            width: 340px; 
            background: linear-gradient(180deg, rgba(15, 20, 25, 0.9) 0%, rgba(10, 15, 23, 0.95) 100%);
            backdrop-filter: blur(15px);
            border-right: 1px solid rgba(99, 102, 241, 0.1); 
            display: flex; 
            flex-direction: column; 
            padding: 12px; 
            gap: 12px; 
            height: 100%; 
            overflow: hidden;
        }

        #chat-area { 
            flex-grow: 1; 
            display: flex; 
            flex-direction: column; 
            background: linear-gradient(135deg, #0f1419 0%, #1a1f2e 100%);
            height: 100%; 
            position: relative; 
        }
        
        @media (max-width: 768px) {
            #sidebar { width: 100%; position: fixed; inset: 0; z-index: 10; }
            #chat-area { width: 100%; height: 100%; position: fixed; inset: 0; z-index: 20; display: none; flex-direction: column; }
            #chat-area.active { display: flex !important; }
        }

        .back-btn { 
            display: none; 
            background: rgba(30, 41, 59, 0.6); 
            border: 1px solid rgba(148, 163, 184, 0.2); 
            color: #94a3b8; 
            padding: 8px 14px; 
            font-size: 13px; 
            border-radius: 8px; 
            cursor: pointer; 
        }

        @media (max-width: 768px) { .back-btn { display: inline-flex; align-items: center; gap: 6px; } }

        #chats-list, #friends-list { 
            display: flex; 
            flex-direction: column; 
            gap: 6px; 
            margin-top: 8px; 
            overflow-y: auto; 
            flex-grow: 1;
        }

        .chat-item { 
            padding: 10px 12px; 
            background: linear-gradient(135deg, rgba(20, 27, 40, 0.6) 0%, rgba(15, 22, 35, 0.6) 100%);
            border-radius: 14px; 
            cursor: pointer; 
            display: flex; 
            align-items: center; 
            gap: 12px;
            font-weight: 500; 
            color: #cbd5e1; 
            transition: all 0.3s ease; 
            border: 1px solid rgba(99, 102, 241, 0.1);
        }

        .chat-item:hover { 
            background: linear-gradient(135deg, rgba(30, 41, 59, 0.7) 0%, rgba(20, 27, 40, 0.7) 100%);
            border-color: rgba(99, 102, 241, 0.3);
            color: #fff;
            transform: translateX(4px);
        }

        .chat-item.active { 
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.2) 0%, rgba(79, 70, 229, 0.15) 100%);
            border-color: rgba(99, 102, 241, 0.5); 
            color: #fff; 
        }

        .chat-item-info {
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            overflow: hidden;
        }

        .chat-item-name {
            font-size: 14px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .del-btn { 
            background: transparent; 
            border: none; 
            color: #ef4444; 
            font-size: 16px; 
            padding: 2px 6px; 
            opacity: 0.6;
            cursor: pointer;
        }

        .del-btn:hover { opacity: 1; }

        .online-dot { 
            width: 10px; 
            height: 10px; 
            border-radius: 50%; 
            position: absolute;
            bottom: 0;
            right: 0;
            border: 2px solid #0f1419;
        }

        .online-dot.on { background: #22c55e; box-shadow: 0 0 6px rgba(34, 197, 94, 0.5); }
        .online-dot.off { background: #64748b; }

        .avatar-wrapper {
            position: relative;
            display: inline-block;
        }

        /* ===== CHAT HEADER ===== */
        .chat-header { 
            padding: 12px 16px; 
            background: linear-gradient(180deg, rgba(20, 27, 40, 0.8) 0%, rgba(20, 27, 40, 0.4) 100%);
            backdrop-filter: blur(15px);
            border-bottom: 1px solid rgba(99, 102, 241, 0.1); 
            display: flex; 
            align-items: center; 
            flex-shrink: 0; 
            gap: 12px;
        }
        
        /* ===== MESSAGES ===== */
        #messages { 
            flex-grow: 1; 
            overflow-y: auto; 
            padding: 14px 12px;
            display: flex; 
            flex-direction: column; 
            gap: 8px;
            min-height: 0;
        }

        .msg-wrapper {
            display: flex;
            gap: 8px;
            align-items: flex-end;
            max-width: 80%;
            animation: slideIn 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .msg-wrapper.my {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .msg { 
            padding: 10px 14px; 
            border-radius: 18px; 
            background: linear-gradient(135deg, rgba(20, 27, 40, 0.9) 0%, rgba(15, 22, 35, 0.9) 100%);
            border: 1px solid rgba(99, 102, 241, 0.1); 
            word-wrap: break-word; 
            color: #e2e8f0; 
            font-size: 14px;
            line-height: 1.4;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(10px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .msg-wrapper.my .msg { 
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.9) 0%, rgba(79, 70, 229, 0.9) 100%);
            border: 1px solid rgba(99, 102, 241, 0.4);
            color: #fff;
        }

        .msg b { 
            color: #a5b4fc; 
            font-size: 11px; 
            display: block; 
            margin-bottom: 2px; 
            font-weight: 700;
        }

        .msg-wrapper.my .msg b { color: #e0e7ff; }

        .msg-meta { 
            display: flex; 
            justify-content: flex-end; 
            align-items: center; 
            gap: 3px; 
            font-size: 10px; 
            opacity: 0.7; 
            margin-top: 4px; 
        }

        .chat-img { 
            max-width: 100%; 
            border-radius: 12px; 
            margin-top: 4px; 
            cursor: pointer;
        }

        /* ВАЖНО: Воспроизведение звука в кружочках */
        .circle-video { 
            width: 160px; 
            height: 160px; 
            border-radius: 50%; 
            object-fit: cover; 
            border: 3px solid rgba(99, 102, 241, 0.6);
            margin-top: 4px; 
            background: #000;
        }

        audio { 
            margin-top: 4px; 
            max-width: 220px;
            height: 32px;
        }

        /* ===== INPUT PANEL ===== */
        .input-panel { 
            padding: 12px; 
            background: linear-gradient(180deg, rgba(20, 27, 40, 0.3) 0%, rgba(20, 27, 40, 0.95) 100%);
            backdrop-filter: blur(20px);
            border-top: 1px solid rgba(99, 102, 241, 0.1); 
            display: flex; 
            flex-direction: column;
            gap: 10px; 
            flex-shrink: 0;
        }

        .input-row { display: flex; gap: 8px; align-items: center; }

        .input-panel input { 
            flex-grow: 1; 
            border-radius: 24px; 
            padding: 12px 18px; 
            background: rgba(10, 15, 23, 0.9);
            border: 1px solid rgba(99, 102, 241, 0.2);
            font-size: 15px;
        }

        .buttons-row { display: flex; gap: 8px; overflow-x: auto; }
        
        .icon-btn { 
            background: linear-gradient(135deg, rgba(30, 41, 59, 0.6) 0%, rgba(20, 27, 40, 0.6) 100%);
            border: 1px solid rgba(99, 102, 241, 0.2); 
            border-radius: 14px; 
            width: 42px; 
            height: 42px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            cursor: pointer; 
            font-size: 18px; 
            flex-shrink: 0; 
            transition: all 0.2s ease;
        }

        .icon-btn:hover { 
            background: rgba(99, 102, 241, 0.3);
            border-color: rgba(99, 102, 241, 0.5);
            transform: translateY(-2px);
        }

        .recording { 
            background: rgba(239, 68, 68, 0.9) !important; 
            animation: pulse 1s infinite;
        }

        .send-btn {
            padding: 0 20px !important;
            border-radius: 20px !important;
            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%) !important;
        }

        /* ===== TABS & USER HEADER ===== */
        .tabs { display: flex; gap: 6px; border-bottom: 1px solid rgba(99, 102, 241, 0.1); padding-bottom: 8px; }

        .tab { 
            cursor: pointer; 
            opacity: 0.5; 
            padding: 8px 14px; 
            font-size: 13px; 
            font-weight: 700; 
            border-radius: 8px; 
        }

        .tab.active { 
            opacity: 1;
            color: #6366f1;
            background: rgba(99, 102, 241, 0.15);
        }

        .user-header { 
            display: flex; 
            align-items: center; 
            gap: 12px;
            padding: 10px; 
            background: rgba(20, 27, 40, 0.7);
            border-radius: 14px;
            border: 1px solid rgba(99, 102, 241, 0.15);
        }

        .user-info { flex-grow: 1; display: flex; flex-direction: column; cursor: pointer; }
        .user-info span { font-weight: 700; color: #fff; font-size: 15px; }
        .user-info small { color: #6366f1; font-size: 11px; }

        .logout-btn { 
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
            padding: 6px 10px; 
            font-size: 12px; 
            border-radius: 8px;
            cursor: pointer;
        }

        /* ===== EMPTY STATE ===== */
        .empty-state {
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 12px;
            color: #64748b;
        }

        .empty-state-icon { font-size: 64px; opacity: 0.3; }
    </style>
</head>
<body>

<!-- АНИМАЦИЯ ВХОДА (SPLASH SCREEN) -->
<div id="splash-screen">
    <div class="splash-logo">Messenger</div>
    <div class="splash-loader"></div>
</div>

<div id="auth-screen">
    <div class="auth-box">
        <h2>Messenger</h2>
        <p class="auth-subtitle">Быстрый и приватный чат</p>
        <input type="text" id="username" placeholder="Логин (@username)">
        <input type="password" id="password" placeholder="Пароль" onkeydown="if(event.key==='Enter') auth('login')">
        <button onclick="auth('login')">Войти</button>
        <button class="sec" onclick="auth('register')">Зарегистрироваться</button>
    </div>
</div>

<div id="app">
    <div id="sidebar">
        <div class="user-header">
            <div class="avatar-wrapper" onclick="changeAvatarPrompt()">
                <div class="avatar" id="my-avatar">U</div>
            </div>
            <div class="user-info" onclick="changeAvatarPrompt()">
                <span id="my-name">@user</span>
                <small>Сменить аватар ✏️</small>
            </div>
            <button class="logout-btn" onclick="logout()">Выйти</button>
        </div>

        <div class="tabs">
            <div class="tab active" id="tab-chats" onclick="switchTab('chats')">💬 Чаты</div>
            <div class="tab" id="tab-friends" onclick="switchTab('friends')">👥 Друзья</div>
        </div>

        <div id="chats-tab-content" style="display:flex; flex-direction:column; flex-grow:1; overflow:hidden; gap: 8px;">
            <button onclick="createPrivate()" style="width:100%">✏️ Написать</button>
            <button class="sec" onclick="createGroup()" style="width:100%">➕ Группа</button>
            <div id="chats-list"></div>
        </div>

        <div id="friends-tab-content" style="display:none; flex-direction:column; flex-grow:1; overflow:hidden; gap: 8px;">
            <button onclick="addFriendPrompt()" style="width:100%">➕ Добавить друга</button>
            <div id="friends-list"></div>
        </div>
    </div>
    
    <div id="chat-area">
        <div class="chat-header">
            <button class="back-btn" onclick="closeMobileChat()">← Назад</button>
            <div id="chat-header-avatar"></div>
            <span id="chat-title" style="font-weight:700;">Выберите чат</span>
        </div>

        <div id="messages">
            <div class="empty-state">
                <div class="empty-state-icon">💬</div>
                <div class="empty-state-text">Выберите чат чтобы начать общение</div>
            </div>
        </div>
        
        <div class="input-panel">
            <div class="input-row">
                <input type="text" id="msg-input" placeholder="Сообщение..." disabled onkeydown="if(event.key==='Enter') sendText()">
                <button class="icon-btn send-btn" onclick="sendText()" title="Отправить">⬆️</button>
            </div>
            <div class="buttons-row">
                <div class="icon-btn" onclick="document.getElementById('file-input').click()" title="Фото/Видео">📸</div>
                <input type="file" id="file-input" style="display:none" onchange="sendFile(this)" accept="image/*,video/*">
                <div class="icon-btn" id="voice-btn" title="Голосовое сообщение" onclick="toggleVoice()">🎙️</div>
                <div class="icon-btn" id="circle-btn" title="Видео круг" onclick="toggleCircle()">📹</div>
            </div>
        </div>
    </div>
</div>

<script>
    let currentUser = "";
    let ws = null;
    let activeChatId = null;
    let pollInterval = null;
    
    let mediaRecorder = null;
    let audioChunks = [];
    let videoChunks = [];
    let isRecordingVoice = false;
    let isRecordingCircle = false;

    // Кеш аватарок пользователей
    const userAvatars = {};

    // Запрос на уведомления
    if ("Notification" in window) {
        Notification.requestPermission();
    }

    // Генерация приятного звука через Web Audio API
    function playNotificationSound() {
        try {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(587.33, ctx.currentTime); // D5
            osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.15); // A5
            gain.gain.setValueAtTime(0.1, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start();
            osc.stop(ctx.currentTime + 0.3);
        } catch(e) {}
    }

    function showPushNotification(title, body) {
        if ("Notification" in window && Notification.permission === "granted" && document.hidden) {
            new Notification(title, { body: body, icon: '/favicon.ico' });
        }
    }

    document.addEventListener("DOMContentLoaded", () => {
        const savedUser = localStorage.getItem('messenger_user');
        
        // Запуск анимации входа при старте
        setTimeout(() => {
            document.getElementById('splash-screen').classList.add('hidden');
        }, 1200);

        if (savedUser) {
            currentUser = savedUser.toLowerCase();
            document.getElementById('auth-screen').style.display = 'none';
            setupUserProfile();
            startApp();
        } else {
            document.getElementById('auth-screen').style.display = 'flex';
        }
    });

    function setupUserProfile() {
        document.getElementById('my-name').innerText = `@${currentUser}`;
        updateAvatarElement(document.getElementById('my-avatar'), currentUser);
    }

    function getAvatarUrl(username) {
        return userAvatars[username] || localStorage.getItem(`avatar_${username}`);
    }

    function updateAvatarElement(element, username) {
        if (!element) return;
        const url = getAvatarUrl(username);
        if (url) {
            element.innerHTML = `<img src="${url}" style="width:100%; height:100%; border-radius:50%; object-fit:cover;">`;
        } else {
            element.innerText = username ? username.charAt(0).toUpperCase() : '?';
        }
    }

    function changeAvatarPrompt() {
        const url = prompt("Введите URL аватарки или оставьте пустым для сброса:");
        if (url !== null) {
            if (url.trim() === "") {
                localStorage.removeItem(`avatar_${currentUser}`);
                delete userAvatars[currentUser];
            } else {
                localStorage.setItem(`avatar_${currentUser}`, url.trim());
                userAvatars[currentUser] = url.trim();
            }
            setupUserProfile();
        }
    }

    function startApp() {
        connectWS();
        loadChats();
        loadFriends();
        if (!pollInterval) {
            pollInterval = setInterval(() => {
                if (activeChatId) fetchMessages(activeChatId, true);
                loadChats();
                loadFriends();
            }, 2000);
        }
    }

    async function auth(type) {
        const u = document.getElementById('username').value.trim().toLowerCase();
        const p = document.getElementById('password').value.trim();
        if(!u || !p) return alert("Заполните все поля!");

        try {
            const res = await fetch(`/${type}`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({username: u, password: p})
            });
            const data = await res.json();
            
            if (res.ok) {
                currentUser = u;
                localStorage.setItem('messenger_user', u);
                document.getElementById('auth-screen').style.display = 'none';
                setupUserProfile();
                startApp();
            } else {
                alert(data.detail || "Ошибка входа");
            }
        } catch (e) { 
            alert("Ошибка подключения к серверу"); 
        }
    }

    function logout() {
        localStorage.removeItem('messenger_user');
        location.reload();
    }

    function connectWS() {
        if (!currentUser) return;
        const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
        ws = new WebSocket(`${protocol}//${location.host}/ws/${currentUser}`);
        
        ws.onmessage = (e) => {
            const data = JSON.parse(e.data);
            
            if (data.sender !== currentUser) {
                playNotificationSound();
                showPushNotification(`Новое сообщение от @${data.sender}`, data.content || "Медиафайл");
            }

            if (activeChatId && parseInt(data.chat_id) === parseInt(activeChatId)) {
                renderMessage(data);
            }
            loadChats();
        };

        ws.onclose = () => setTimeout(connectWS, 3000);
    }

    function switchTab(tab) {
        document.getElementById('tab-chats').classList.toggle('active', tab === 'chats');
        document.getElementById('tab-friends').classList.toggle('active', tab === 'friends');
        document.getElementById('chats-tab-content').style.display = tab === 'chats' ? 'flex' : 'none';
        document.getElementById('friends-tab-content').style.display = tab === 'friends' ? 'flex' : 'none';
    }

    async function loadChats() {
        if (!currentUser) return;
        try {
            const res = await fetch(`/chats/${currentUser}`);
            if (!res.ok) return;
            const chats = await res.json();
            const list = document.getElementById('chats-list');
            list.innerHTML = '';

            if (chats.length === 0) {
                list.innerHTML = '<div style="text-align:center; color:#64748b; padding:20px; font-size:13px;">Нет чатов</div>';
                return;
            }

            chats.forEach(chat => {
                const div = document.createElement('div');
                div.className = `chat-item ${chat.id === activeChatId ? 'active' : ''}`;
                
                const dotClass = chat.online ? 'on' : 'off';
                const avatarDiv = document.createElement('div');
                avatarDiv.className = 'avatar-wrapper';
                
                const avatarEl = document.createElement('div');
                avatarEl.className = 'avatar avatar-sm';
                updateAvatarElement(avatarEl, chat.name.replace('@',''));
                avatarDiv.appendChild(avatarEl);

                if (chat.type === 'private') {
                    avatarDiv.innerHTML += `<span class="online-dot ${dotClass}"></span>`;
                }

                div.appendChild(avatarDiv);
                
                const infoDiv = document.createElement('div');
                infoDiv.className = 'chat-item-info';
                infoDiv.innerHTML = `<span class="chat-item-name">${chat.name}</span>`;
                div.appendChild(infoDiv);

                const delBtn = document.createElement('button');
                delBtn.className = 'del-btn';
                delBtn.innerText = '✕';
                delBtn.onclick = (e) => deleteChat(e, chat.id);
                div.appendChild(delBtn);

                div.onclick = (e) => {
                    if(e.target.tagName !== 'BUTTON') {
                        openChat(chat.id, chat.name);
                    }
                };
                list.appendChild(div);
            });
        } catch (e) { console.error(e); }
    }

    async function deleteChat(event, chatId) {
        event.stopPropagation();
        if(!confirm("Удалить чат?")) return;
        await fetch(`/chats/${chatId}`, { method: 'DELETE' });
        if(activeChatId === chatId) {
            activeChatId = null;
            closeMobileChat();
        }
        loadChats();
    }

    async function loadFriends() {
        if (!currentUser) return;
        try {
            const res = await fetch(`/friends/${currentUser}`);
            if (!res.ok) return;
            const friends = await res.json();
            const list = document.getElementById('friends-list');
            list.innerHTML = '';

            if (friends.length === 0) {
                list.innerHTML = '<div style="text-align:center; color:#64748b; padding:20px; font-size:13px;">Нет друзей</div>';
                return;
            }

            friends.forEach(friend => {
                const div = document.createElement('div');
                div.className = 'chat-item';
                
                const avatarDiv = document.createElement('div');
                avatarDiv.className = 'avatar-wrapper';
                const avatarEl = document.createElement('div');
                avatarEl.className = 'avatar avatar-sm';
                updateAvatarElement(avatarEl, friend.username);
                avatarDiv.appendChild(avatarEl);
                avatarDiv.innerHTML += `<span class="online-dot ${friend.online ? 'on' : 'off'}"></span>`;

                div.appendChild(avatarDiv);
                div.innerHTML += `<span style="font-weight:600;">@${friend.username}</span>`;
                div.onclick = () => startPrivateWith(friend.username);
                list.appendChild(div);
            });
        } catch (e) { console.error(e); }
    }

    async function addFriendPrompt() {
        const target = prompt("@username:");
        if (!target) return;
        const res = await fetch('/friends/add', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({username: currentUser, friend_username: target.toLowerCase()})
        });
        const data = await res.json();
        if(res.ok) {
            alert("✅ Друг добавлен!");
            loadFriends();
        } else { 
            alert(data.detail || "Ошибка"); 
        }
    }

    async function startPrivateWith(targetUsername) {
        const res = await fetch('/chats/private', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({sender_username: currentUser, target_username: targetUsername})
        });
        const data = await res.json();
        switchTab('chats');
        openChat(data.chat_id, `@${targetUsername}`);
    }

    async function openChat(chatId, title = "Чат") {
        activeChatId = chatId;
        document.getElementById('msg-input').disabled = false;
        document.getElementById('msg-input').placeholder = "Сообщение...";
        document.getElementById('chat-title').innerText = title;
        
        const headerAvatar = document.getElementById('chat-header-avatar');
        headerAvatar.innerHTML = '';
        const av = document.createElement('div');
        av.className = 'avatar avatar-sm';
        updateAvatarElement(av, title.replace('@','').replace('👥 ',''));
        headerAvatar.appendChild(av);

        document.getElementById('chat-area').classList.add('active');
        
        loadChats();
        await fetchMessages(chatId, false);
    }

    function closeMobileChat() {
        activeChatId = null;
        document.getElementById('chat-area').classList.remove('active');
        document.getElementById('msg-input').disabled = true;
        document.getElementById('messages').innerHTML = '<div class="empty-state"><div class="empty-state-icon">💬</div><div class="empty-state-text">Выберите чат</div></div>';
        document.getElementById('chat-title').innerText = 'Выберите чат';
        document.getElementById('chat-header-avatar').innerHTML = '';
    }

    let lastMessagesHash = "";
    async function fetchMessages(chatId, isBackground = false) {
        try {
            const res = await fetch(`/messages/${chatId}/${currentUser}`);
            if (!res.ok) return;
            
            const messages = await res.json();
            const currentHash = JSON.stringify(messages);
            if (isBackground && currentHash === lastMessagesHash) return;
            lastMessagesHash = currentHash;

            const box = document.getElementById('messages');
            box.innerHTML = '';
            
            if (!messages || messages.length === 0) {
                box.innerHTML = '<div class="empty-state"><div class="empty-state-icon">👋</div><div class="empty-state-text">Начните разговор</div></div>';
                return;
            }
            
            messages.forEach((msg) => {
                renderMessage(msg);
            });
        } catch(e) { console.error(e); }
    }

    function renderMessage(data) {
        const box = document.getElementById('messages');
        if (box.querySelector('.empty-state')) box.innerHTML = '';

        const isMy = data.sender === currentUser;
        const wrapper = document.createElement('div');
        wrapper.className = `msg-wrapper ${isMy ? 'my' : ''}`;
        
        const avatar = document.createElement('div');
        avatar.className = 'avatar avatar-sm';
        updateAvatarElement(avatar, data.sender);

        const div = document.createElement('div');
        div.className = 'msg';
        
        let contentHTML = `<b>@${data.sender}</b>`;
        if (data.type === 'text') {
            contentHTML += data.content;
        } else if (data.type === 'image') {
            contentHTML += `<img src="${data.content}" class="chat-img" onclick="window.open(this.src)">`;
        } else if (data.type === 'voice') {
            contentHTML += `<audio controls src="${data.content}"></audio>`;
        } else if (data.type === 'circle') {
            // Включаем звук (без muted) и делаем элементы управления при клике
            contentHTML += `<video class="circle-video" src="${data.content}" autoplay loop playsinline controls></video>`;
        }
        
        let statusTag = isMy ? (data.is_read ? '✓✓' : '✓') : '';
        if (statusTag) contentHTML += `<div class="msg-meta">${statusTag}</div>`;
        
        div.innerHTML = contentHTML;
        wrapper.appendChild(avatar);
        wrapper.appendChild(div);
        box.appendChild(wrapper);
        
        setTimeout(() => { box.scrollTop = box.scrollHeight; }, 50);
    }

    function sendText() {
        const input = document.getElementById('msg-input');
        if (!input.value.trim() || !activeChatId) return;
        const text = input.value.trim();
        input.value = '';

        if (ws && ws.readyState === WebSocket.OPEN) {
            ws.send(JSON.stringify({ chat_id: activeChatId, type: 'text', content: text }));
        }
    }

    function sendFile(input) {
        if (!input.files || !input.files[0] || !activeChatId) return;
        const file = input.files[0];
        const reader = new FileReader();
        reader.onload = function(e) {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ chat_id: activeChatId, type: 'image', content: e.target.result }));
            }
        };
        reader.readAsDataURL(file);
        input.value = '';
    }

    async function toggleVoice() {
        if (!activeChatId) return alert("Сначала выберите чат!");
        const btn = document.getElementById('voice-btn');
        
        if (!isRecordingVoice) {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];
                
                mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                mediaRecorder.onstop = async () => {
                    const blob = new Blob(audioChunks, { type: 'audio/webm' });
                    const reader = new FileReader();
                    reader.readAsDataURL(blob);
                    reader.onloadend = () => {
                        if (ws && ws.readyState === WebSocket.OPEN) {
                            ws.send(JSON.stringify({ chat_id: activeChatId, type: 'voice', content: reader.result }));
                        }
                    };
                    stream.getTracks().forEach(track => track.stop());
                };
                
                mediaRecorder.start();
                isRecordingVoice = true;
                btn.classList.add('recording');
            } catch(e) { alert("❌ Ошибка микрофона"); }
        } else {
            mediaRecorder.stop();
            isRecordingVoice = false;
            btn.classList.remove('recording');
        }
    }

    async function toggleCircle() {
        if (!activeChatId) return alert("Сначала выберите чат!");
        const btn = document.getElementById('circle-btn');
        
        if (!isRecordingCircle) {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 300, height: 300 }, audio: true });
                mediaRecorder = new MediaRecorder(stream);
                videoChunks = [];
                
                mediaRecorder.ondataavailable = e => videoChunks.push(e.data);
                mediaRecorder.onstop = async () => {
                    const blob = new Blob(videoChunks, { type: 'video/webm' });
                    const reader = new FileReader();
                    reader.readAsDataURL(blob);
                    reader.onloadend = () => {
                        if (ws && ws.readyState === WebSocket.OPEN) {
                            ws.send(JSON.stringify({ chat_id: activeChatId, type: 'circle', content: reader.result }));
                        }
                    };
                    stream.getTracks().forEach(track => track.stop());
                };
                
                mediaRecorder.start();
                isRecordingCircle = true;
                btn.classList.add('recording');
            } catch(e) { alert("❌ Ошибка камеры"); }
        } else {
            mediaRecorder.stop();
            isRecordingCircle = false;
            btn.classList.remove('recording');
        }
    }

    async function createPrivate() {
        const target = prompt("@username:");
        if (!target) return;
        startPrivateWith(target.toLowerCase());
    }

    async function createGroup() {
        const name = prompt("Название группы:");
        if (!name) return;
        const membersStr = prompt("Логины через запятую:");
        if (!membersStr) return;
        const members = membersStr.split(',').map(m => m.trim().toLowerCase());
        members.push(currentUser);
        
        const res = await fetch('/chats/group', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({name: name, members: members})
        });
        const data = await res.json();
        openChat(data.chat_id, `👥 ${name}`);
    }
</script>
